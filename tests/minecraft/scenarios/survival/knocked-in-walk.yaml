template: ../../templates/flat-single-action-no-regen.yaml

tags: [acceptance, regression]
description: >-
  KnockedIn walks a stone pier and is pushed onto the bed of the ten-deep pool
  beside it a third of the way along, as a knockback or a misstep would leave
  it. It must surface and still finish the walk. Regeneration is off, so the
  health floor bounds the drowning taken.
  The push makes the walk's next movement fail, and the route replans from
  the seabed in that same tick, before the server has sent any air: a body
  that never dived has none. Planned on dry land with no dive admission, the
  replan found no path after one node and the request ended; now the dive
  waits for the air and plans once more from where the body is.

reset:
  - "fill -2 -61 -9 20 -46 9 air"

# A stone pier at -50 running east from x 2 to x 16 between walls, at the
# water line of a pool -60..-50 deep; the walk starts at the west end. The deck
# is flush with the water, as a bank is: climbing out onto a ledge a block
# above the surface is a movement navigation does not have yet.
geometry:
  - fill: { block: stone, from: [0, -61, -7], to: [18, -48, 7] }
  - fill: { block: water, from: [1, -60, -6], to: [17, -50, 6] }
  - fill: { block: air, from: [1, -49, -6], to: [17, -48, 6] }
  - fill: { block: stone, from: [2, -50, 0], to: [16, -50, 0] }

players:
  - name: KnockedIn
    pos: [2.5, -49, 0.5]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  players:
    KnockedIn:
      waitTicks: 20
      actions:
        - action: navigate
          input: { x: 15, y: -49, z: 0, range: 1, dig: false, scaffold: false }
      holdTicks: 600

tick:
  - "gamemode spectator @a[name=!KnockedIn,gamemode=!spectator]"

schedule:
  - afterTicks: 0
    run:
      # A tag left on a reused player by an earlier trial must not count.
      - "tag KnockedIn remove ml_pushed"
  - afterTicks: 1
    when: "entity @a[name=KnockedIn,x=6,y=-50,z=-1,dx=3,dy=3,dz=2]"
    run:
      - "tp KnockedIn 8.5 -59 4.5"
      - "tag KnockedIn add ml_pushed"

goal:
  kind: all
  timeout: 90
  goals:
    # Pushed in, surfaced, and the walk finished on the pier's east end.
    - { kind: entityCount, entity: player, tag: ml_pushed, min: 1 }
    - { kind: reach, who: KnockedIn, pos: [15.5, -49, 0.5], radius: 1.5 }
    - { kind: health, who: KnockedIn, health: 16 }
    - { kind: survive, who: KnockedIn, seconds: 40 }
    - { kind: completion, who: KnockedIn }
