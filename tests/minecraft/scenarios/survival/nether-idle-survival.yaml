template: ../../templates/single-action.yaml

tags: [acceptance]
description: >-
  Three idle bots in native Nether terrain on seed 20260906, each left to the
  runtime's reflexes. CliffBot stands at 11 health on the lip of a 14-block
  netherrack cliff while an enderman that is angry at it from the first tick
  attacks; a fall or a lost fight is fatal. DeltaBot stands at 11 health on a
  basalt-deltas shelf beside two large magma cubes, with lava and magma blocks
  around. Neither wounded bot can heal: their food bar stays below the
  regeneration threshold and they carry no food. LavaBot, at full health with
  an unusable water bucket, is dropped into the middle of a lava pool with no
  bank in reach and must place a step, climb out and outlive the burn.
  Every bot ends alive. Folds wounded-cliff, generated-basalt-wounded and
  lava-escape-step-nether.

# Natural regeneration stays on for LavaBot, as in its legacy fixture, where
# regeneration let it outlive the residual burn. The wounded pens are held
# below the food level natural regeneration needs (18) instead, which keeps
# them at 11 health or less as the legacy gamerule did.
world:
  type: default
  dimension: the_nether
  seed: 20260906
  structures: true
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: true
    keepInventory: false
    randomTickSpeed: 0

setup:
  - "scoreboard objectives add ml_fire dummy"

# LavaBot's pool is built on the Nether roof, 104 blocks and more from the
# other two pens: a netherrack bed over the bedrock ceiling, a 13x13 lava pool
# whose centre is six blocks from every edge, and a dry bank to the east where
# the bot waits until the trial starts.
geometry:
  - fill: { block: air, from: [122, 128, -119], to: [140, 136, -101] }
  - fill: { block: netherrack, from: [122, 128, -119], to: [140, 128, -101] }
  - fill: { block: lava, from: [125, 129, -116], to: [137, 129, -104] }
  - fill: { block: netherrack, from: [138, 129, -119], to: [140, 129, -101] }
  # DeltaBot's body cells. Basalt-delta decoration on this seed differs between
  # fresh worlds; in one the shelf had basalt in the bot's cells, it
  # suffocated on arrival, respawned without its kit, and the trial never
  # started. Clearing the two cells keeps the native shelf around it.
  - fill: { block: air, from: [192, 49, -20], to: [192, 50, -20] }

players:
  # The legacy wounded-cliff lip; the drop falls 14 blocks east of it.
  - name: CliffBot
    pos: [71.5, 65, -19.5]
    health: 11
    food: 17
    equipment:
      head: iron_helmet
      chest: iron_chestplate
      legs: iron_leggings
      feet: golden_boots
      offhand: shield
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: iron_pickaxe, count: 1 }
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: cobblestone, count: 64 }
  # The legacy generated-basalt-wounded shelf, re-surveyed on 2026-10-20.
  - name: DeltaBot
    pos: [192.5, 49, -19.5]
    health: 11
    food: 17
    equipment:
      head: iron_helmet
      chest: iron_chestplate
      legs: iron_leggings
      feet: iron_boots
      offhand: shield
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: iron_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
  - name: LavaBot
    pos: [139.5, 130, -109.5]
    inventory:
      - { item: cobblestone, count: 8 }
      - { item: water_bucket, count: 1 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/idle.ts]
params:
  # Every pen idles the whole trial, so none is left without reflexes while
  # another is still running.
  waitTicks: 1300

schedule:
  - afterTicks: 0
    run:
      # A tag a reused player kept from an earlier trial must not count.
      - "tag @a remove ml_burned_LavaBot"
      - "tp LavaBot 131.5 129 -109.5"
      # Angry at CliffBot from its first tick: AngryAt is CliffBot's offline UUID.
      - 'summon minecraft:enderman 70.5 66 -17.5 {PersistenceRequired:1b,AngerTime:2400,AngryAt:[I;-1502120180,-886294984,-1715084890,-1563292787]}'
      - "summon minecraft:magma_cube 195.5 49 -18.5 {Size:3,PersistenceRequired:1b}"
      - "summon minecraft:magma_cube 197.5 49 -17.5 {Size:3,PersistenceRequired:1b}"
  - { afterTicks: 1, when: "entity @a[name=LavaBot,scores={ml_fire=1..}]", run: "tag LavaBot add ml_burned_LavaBot" }

tick:
  - "execute as @a store result score @s ml_fire run data get entity @s Fire"

goal:
  kind: all
  timeout: 150
  goals:
    - { kind: survive, who: CliffBot, seconds: 60 }
    - { kind: health, who: CliffBot, health: 1 }
    - { kind: completion, who: CliffBot }
    - { kind: survive, who: DeltaBot, seconds: 60 }
    - { kind: health, who: DeltaBot, health: 1 }
    - { kind: completion, who: DeltaBot }
    # The lava must have reached LavaBot, so a teleport that missed cannot pass.
    - { kind: entityCount, entity: player, tag: ml_burned_LavaBot, min: 1 }
    - { kind: survive, who: LavaBot, seconds: 60 }
    - { kind: health, who: LavaBot, health: 1 }
    - { kind: completion, who: LavaBot }
