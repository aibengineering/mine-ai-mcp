template: ../../templates/flat-single-action-no-regen.yaml

tags: [acceptance, regression]
description: >-
  Every situation the breath reflex serves, in twelve pens side by side.
  Rising alone: ShallowIdler in a two-deep lake, DeepIdler at the bottom of a
  six-deep pool, DeepRiser in an eighteen-deep column, and DeepSea on the bed
  of a twenty-deep sea with no edge in reach, which must also stay afloat.
  Under a roof: SealedDiver digs up through two blocks of stone beside a
  dolphin publishing 6000 air (the eighth playthrough's drowning), OffsetDiver
  is in a falling column whose overhang catches its shoulder (EnderSeeker,
  2026-09-09), and LowAirDiver, empty-handed and at 120 air, has to swim clear
  of a bedrock overhang. Air beyond the next stroke, under obsidian no tool
  here can dig, reached by a route through the water beneath it:
  PocketSwimmer with air six blocks east, TunnelSwimmer fourteen blocks along
  a flooded tunnel, LidSwimmer with a stone pickaxe that cannot mine the
  ceiling and air four blocks east, and SkylightSwimmer with an air shaft four
  blocks east. With a request: PocketRescue is PocketSwimmer's room, where the
  agent asks to swim to the air the reflex has already reached. Regeneration
  is off, so each health floor bounds the drowning taken.
  Until the response routed through navigation, the four obsidian rooms and
  PocketRescue drowned about 25 s in: the idle rise had lifted each bot
  against the ceiling, and the reflex held jump and hand-dug obsidian until
  it died. A walk knocked into the water mid-route is
  known-failing/survival/knocked-in-walk's; the planned-dive cases, where
  navigation owns the breath budget, are pathfinder/underwater-course's.

# Pens sit side by side along x, sealed or walled so nothing crosses between
# them. Every bot waits on a dry stand, because the host prepares a grounded,
# still body; the schedule drops each into its water on the first tick, so it
# starts with a full bar. LowAirDiver is released later, at 120 air.
reset:
  - "fill -8 -61 -18 280 -18 18 air"

setup:
  # LowAirDiver's air, copied every tick by `tick` below.
  - "scoreboard objectives add ml_air dummy"

geometry:
  # PocketSwimmer: water -59..-57 under an obsidian ceiling at -56, and a
  # pocket at x 8..10 with air at -56 and -55 under a ceiling at -54.
  - fill: { block: obsidian, from: [-1, -60, -3], to: [11, -54, 3] }
  - fill: { block: water, from: [0, -59, -2], to: [7, -57, 2] }
  - fill: { block: water, from: [8, -59, -2], to: [10, -57, 2] }
  - fill: { block: air, from: [8, -56, -2], to: [10, -55, 2] }

  # TunnelSwimmer: a one-wide, two-high flooded tunnel east along z 0 to x 24,
  # north along x 24 to z 5, then a chamber whose water is one deep under air.
  - fill: { block: obsidian, from: [15, -60, -1], to: [26, -54, 9] }
  - fill: { block: water, from: [16, -59, 0], to: [24, -58, 0] }
  - fill: { block: water, from: [24, -59, 1], to: [24, -58, 5] }
  - fill: { block: water, from: [23, -59, 6], to: [25, -59, 8] }
  - fill: { block: air, from: [23, -58, 6], to: [25, -56, 8] }

  # LidSwimmer: PocketSwimmer's room, shorter, with the pocket at x 35..37.
  - fill: { block: obsidian, from: [30, -60, -3], to: [38, -54, 3] }
  - fill: { block: water, from: [31, -59, -2], to: [34, -57, 2] }
  - fill: { block: water, from: [35, -59, -2], to: [37, -57, 2] }
  - fill: { block: air, from: [35, -56, -2], to: [37, -55, 2] }

  # SkylightSwimmer: water -59..-57 under an obsidian ceiling at -56, broken by
  # a one-block air shaft at x 48 rising to the roof at -54.
  - fill: { block: obsidian, from: [43, -60, -3], to: [51, -54, 3] }
  - fill: { block: water, from: [44, -59, -2], to: [50, -57, 2] }
  - fill: { block: air, from: [48, -56, 0], to: [48, -55, 0] }

  # DeepRiser: a one-by-one stone column, water -59..-42, open to the sky.
  - fill: { block: stone, from: [56, -60, -1], to: [58, -41, 1] }
  - fill: { block: water, from: [57, -59, 0], to: [57, -42, 0] }
  - setblock: { block: air, at: [57, -41, 0] }

  # SealedDiver: the roofed chamber, water -59..-57 under two blocks of stone,
  # and a second sealed pool holding the dolphin.
  - fill: { block: stone, from: [64, -60, -4], to: [80, -55, 8] }
  - fill: { block: water, from: [68, -59, 0], to: [72, -57, 4] }
  - fill: { block: water, from: [75, -59, 0], to: [78, -57, 4] }

  # DeepIdler: a deep stone pool, water -59..-54, with a dry platform at rim
  # height for the stand.
  - fill: { block: stone, from: [96, -60, -10], to: [116, -60, 10] }
  - fill: { block: stone, from: [96, -59, -10], to: [96, -53, 10] }
  - fill: { block: stone, from: [116, -59, -10], to: [116, -53, 10] }
  - fill: { block: stone, from: [97, -59, -10], to: [115, -53, -10] }
  - fill: { block: stone, from: [97, -59, 10], to: [115, -53, 10] }
  - fill: { block: water, from: [97, -59, -9], to: [115, -54, 9] }
  - fill: { block: stone, from: [86, -53, -3], to: [96, -53, 3] }

  # ShallowIdler: a two-deep lake on a stone bed, and a stand above its edge.
  - fill: { block: stone, from: [122, -61, -8], to: [138, -61, 8] }
  - fill: { block: water, from: [123, -60, -7], to: [137, -59, 7] }
  - setblock: { block: stone, at: [130, -56, 12] }

  # OffsetDiver: a source at -20 feeding a native falling column down to a
  # deepslate floor at -55. The live incident is translated so the column's
  # centre roof cell is water, but the 0.6-wide body overlaps the deepslate
  # cell to the north at head height.
  - fill: { block: deepslate, from: [142, -55, -8], to: [158, -55, 8] }
  - fill: { block: deepslate, from: [149, -20, -1], to: [151, -20, 1] }
  - setblock: { block: water, at: [150, -20, 0] }
  - fill: { block: "water[level=8]", from: [150, -54, 0], to: [150, -21, 0] }
  - setblock: { block: deepslate, at: [150, -31, -1] }
  - setblock: { block: stone, at: [162, -55, 0] }

  # LowAirDiver: the same column under a bedrock overhang, which no tool can
  # dig, and a sealed bedrock water pocket where its air drains first.
  - fill: { block: deepslate, from: [167, -55, -8], to: [183, -55, 8] }
  - fill: { block: deepslate, from: [174, -20, -1], to: [176, -20, 1] }
  - setblock: { block: water, at: [175, -20, 0] }
  - fill: { block: "water[level=8]", from: [175, -54, 0], to: [175, -21, 0] }
  - setblock: { block: bedrock, at: [175, -31, -1] }
  - fill: { block: bedrock, from: [178, -41, -1], to: [180, -37, 1] }
  - fill: { block: water, from: [179, -40, 0], to: [179, -38, 0] }
  - setblock: { block: stone, at: [187, -55, 0] }

  # DeepSea: a stone basin with water -59..-40, twenty deep and twenty-nine
  # wide, open to the sky, and a stand on its west wall.
  - fill: { block: stone, from: [195, -60, -15], to: [225, -39, 15] }
  - fill: { block: water, from: [196, -59, -14], to: [224, -40, 14] }
  - fill: { block: air, from: [196, -39, -14], to: [224, -39, 14] }

  # PocketRescue: PocketSwimmer's room again, for the agent's rescue.
  - fill: { block: obsidian, from: [259, -60, -3], to: [271, -54, 3] }
  - fill: { block: water, from: [260, -59, -2], to: [267, -57, 2] }
  - fill: { block: water, from: [268, -59, -2], to: [270, -57, 2] }
  - fill: { block: air, from: [268, -56, -2], to: [270, -55, 2] }

entities:
  # Its air supply is far larger than any player's: the reflex must read the
  # bot's own air, not a neighbour's.
  - type: dolphin
    pos: [76.5, -58, 2.5]
    nbt: "{NoAI:1b,Invulnerable:1b,PersistenceRequired:1b,Air:6000s}"

players:
  - name: PocketSwimmer
    pos: [2.5, -53, 0.5]
  - name: TunnelSwimmer
    pos: [17.5, -53, 4.5]
  - name: LidSwimmer
    pos: [32.5, -53, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
  - name: SkylightSwimmer
    pos: [45.5, -53, 0.5]
  - name: DeepRiser
    pos: [58.5, -40, 0.5]
  - name: SealedDiver
    pos: [65.5, -54, -2.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
  - name: DeepIdler
    pos: [90.5, -52, 0.5]
  - name: ShallowIdler
    pos: [130.5, -55, 12.5]
  - name: OffsetDiver
    pos: [162.5, -54, 0.5]
    inventory:
      - { item: diamond_pickaxe, count: 1 }
  - name: LowAirDiver
    pos: [187.5, -54, 0.5]
  - name: DeepSea
    pos: [195.5, -38, 0.5]
  - name: PocketRescue
    pos: [262.5, -53, 0.5]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  # Every pen holds its reflexes for 90 s: a pen whose driver returned early
  # would sit in the water with them closed, and sink and drown while the
  # trial waited for the last pen.
  players:
    PocketSwimmer: { waitTicks: 1800 }
    TunnelSwimmer: { waitTicks: 1800 }
    LidSwimmer: { waitTicks: 1800 }
    SkylightSwimmer: { waitTicks: 1800 }
    DeepRiser: { waitTicks: 1800 }
    SealedDiver: { waitTicks: 1800 }
    DeepIdler: { waitTicks: 1800 }
    ShallowIdler: { waitTicks: 1800 }
    OffsetDiver: { waitTicks: 1800 }
    LowAirDiver: { waitTicks: 1800 }
    DeepSea: { waitTicks: 1800 }
    PocketRescue:
      # The breath reflex fires at twelve to eighteen points of air, so by 140
      # ticks after the drop it owns the body. Wait for it to let go before
      # asking, as a model told the body is busy would.
      waitTicks: 140
      actions:
        - action: navigate
          input: { x: 269, y: -57, z: 0, range: 1, dig: false, scaffold: false }
          idleWithinTicks: 700
      # Held past the 90 s the other pens wait, since the goals are judged
      # when the last one finishes: released early, its idle body sank to the
      # pocket's floor, out of reach of the target, and drowned there.
      holdTicks: 1800

tick:
  - "gamemode spectator @a[name=!PocketSwimmer,name=!TunnelSwimmer,name=!LidSwimmer,name=!SkylightSwimmer,name=!DeepRiser,name=!SealedDiver,name=!DeepIdler,name=!ShallowIdler,name=!OffsetDiver,name=!LowAirDiver,name=!DeepSea,name=!PocketRescue,gamemode=!spectator]"
  - "execute as @a[name=LowAirDiver] store result score @s ml_air run data get entity @s Air"

schedule:
  - afterTicks: 0
    run:
      - "tp PocketSwimmer 1.5 -59 0.5"
      - "tp TunnelSwimmer 16.5 -59 0.5"
      - "tp LidSwimmer 31.5 -59 0.5"
      - "tp SkylightSwimmer 44.5 -59 0.5"
      - "tp DeepRiser 57.5 -59 0.5"
      - "tp SealedDiver 70.5 -59 2.5"
      - "tp DeepIdler 106.5 -59 5.5"
      - "tp ShallowIdler 130.5 -60 0.5"
      # The recorded fractional position, translated with the column.
      - "tp OffsetDiver 150.02621917259805 -40 0.08979961991747"
      - "tp LowAirDiver 179.5 -40 0.5"
      - "tp DeepSea 210.5 -59 0.5"
      - "tp PocketRescue 261.5 -59 0.5"
      # Tags left on a reused player by an earlier trial must not count.
      - "tag LowAirDiver remove ml_released"
  # Released under the overhang with 120 of 300 air: rising alone cannot
  # breathe there and digging cannot open bedrock.
  - afterTicks: 1
    when: "entity @a[name=LowAirDiver,scores={ml_air=..120}]"
    run:
      - "tp LowAirDiver 175.02621917259805 -36 0.08979961991747"
      - "tag LowAirDiver add ml_released"

goal:
  kind: all
  timeout: 150
  goals:
    # A bot that never reached air is dead within about 25 seconds; surviving
    # 40 proves the escape, and the health floor bounds what it cost.
    - { kind: survive, who: PocketSwimmer, seconds: 40 }
    - { kind: health, who: PocketSwimmer, health: 10 }
    - { kind: completion, who: PocketSwimmer }
    - { kind: survive, who: TunnelSwimmer, seconds: 40 }
    - { kind: health, who: TunnelSwimmer, health: 10 }
    - { kind: completion, who: TunnelSwimmer }
    - { kind: survive, who: LidSwimmer, seconds: 40 }
    - { kind: health, who: LidSwimmer, health: 10 }
    - { kind: completion, who: LidSwimmer }
    - { kind: survive, who: SkylightSwimmer, seconds: 40 }
    - { kind: health, who: SkylightSwimmer, health: 10 }
    - { kind: completion, who: SkylightSwimmer }
    - { kind: survive, who: DeepRiser, seconds: 40 }
    - { kind: health, who: DeepRiser, health: 18 }
    - { kind: completion, who: DeepRiser }
    - { kind: health, who: SealedDiver, health: 14 }
    - { kind: survive, who: SealedDiver, seconds: 40 }
    - { kind: completion, who: SealedDiver }
    # The legacy pool allowed at most two health lost.
    - { kind: health, who: DeepIdler, health: 18 }
    - { kind: survive, who: DeepIdler, seconds: 40 }
    - { kind: completion, who: DeepIdler }
    - { kind: health, who: ShallowIdler, health: 18 }
    - { kind: survive, who: ShallowIdler, seconds: 25 }
    - { kind: completion, who: ShallowIdler }
    - { kind: health, who: OffsetDiver, health: 14 }
    - { kind: survive, who: OffsetDiver, seconds: 40 }
    - { kind: completion, who: OffsetDiver }
    # The release really happened: the low-air start is part of the arrangement.
    - { kind: entityCount, entity: player, tag: ml_released, min: 1 }
    - { kind: health, who: LowAirDiver, health: 14 }
    - { kind: survive, who: LowAirDiver, seconds: 40 }
    - { kind: completion, who: LowAirDiver }
    # Twenty deep with no edge in reach: rise, then stay afloat.
    - { kind: health, who: DeepSea, health: 18 }
    - { kind: survive, who: DeepSea, seconds: 40 }
    - { kind: completion, who: DeepSea }
    - { kind: reach, who: PocketRescue, pos: [269.5, -57, 0.5], radius: 2 }
    - { kind: survive, who: PocketRescue, seconds: 30 }
    - { kind: completion, who: PocketRescue }
