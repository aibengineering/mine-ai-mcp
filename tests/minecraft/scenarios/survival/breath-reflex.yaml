template: ../../templates/flat-single-action-no-regen.yaml

tags: [acceptance, regression]
description: >-
  Five idle bots are put under water at the start and nothing is requested;
  the runtime's breath reflex and idle water-surface rise must keep each one
  breathing. SealedDiver is in a flooded chamber under a stone roof, beside a
  dolphin publishing 6000 air, and must dig out on its own air (the eighth
  playthrough's drowning, where a running action held the body). DeepIdler
  sits at the bottom of a deep open pool and ShallowIdler in a two-deep lake.
  OffsetDiver is off-centre in a 35-block falling-water column where its
  shoulder catches a deepslate overhang (EnderSeeker's 2026-09-09 drowning,
  where a centre-only roof probe held jump against the overhang).
  LowAirDiver, empty-handed, is released at 120 air under an undiggable
  bedrock overhang and has to swim clear. With regeneration off, each health
  floor bounds the drowning damage taken.

# Pens are 100 blocks apart along x. Every diver waits on a dry stand, because
# the host prepares a grounded, still body, and a bot prepared under water
# would spend its air before the runtime starts. The schedule teleports all of
# them into place on the first tick, so each begins with a full bar.
reset:
  - "fill -8 -60 -12 416 -18 16 air"

setup:
  # LowAirDiver's air, copied every tick by `tick` below.
  - "scoreboard objectives add ml_air dummy"

geometry:
  # SealedDiver: the roofed chamber, water -59..-57 under two blocks of stone,
  # and a second sealed pool holding the dolphin.
  - fill: { block: stone, from: [-4, -60, -4], to: [12, -55, 8] }
  - fill: { block: water, from: [0, -59, 0], to: [4, -57, 4] }
  - fill: { block: water, from: [7, -59, 0], to: [10, -57, 4] }

  # DeepIdler: a deep stone pool, water -59..-54, with a dry platform at rim
  # height for the stand.
  - fill: { block: stone, from: [106, -60, -10], to: [126, -60, 10] }
  - fill: { block: stone, from: [106, -59, -10], to: [106, -53, 10] }
  - fill: { block: stone, from: [126, -59, -10], to: [126, -53, 10] }
  - fill: { block: stone, from: [107, -59, -10], to: [125, -53, -10] }
  - fill: { block: stone, from: [107, -59, 10], to: [125, -53, 10] }
  - fill: { block: water, from: [107, -59, -9], to: [125, -54, 9] }
  - fill: { block: stone, from: [96, -53, -3], to: [106, -53, 3] }

  # ShallowIdler: a two-deep lake on a stone bed, and a stand above its edge.
  - fill: { block: stone, from: [192, -61, -8], to: [208, -61, 8] }
  - fill: { block: water, from: [193, -60, -7], to: [207, -59, 7] }
  - setblock: { block: stone, at: [200, -56, 12] }

  # OffsetDiver: a source at -20 feeding a native falling column down to a
  # deepslate floor at -55. The live incident is translated by x=+110,
  # z=+288: the column's centre roof cell is water, but the 0.6-wide body
  # overlaps the deepslate cell to the north at head height.
  - fill: { block: deepslate, from: [292, -55, -8], to: [308, -55, 8] }
  - fill: { block: deepslate, from: [299, -20, -1], to: [301, -20, 1] }
  - setblock: { block: water, at: [300, -20, 0] }
  - fill: { block: "water[level=8]", from: [300, -54, 0], to: [300, -21, 0] }
  - setblock: { block: deepslate, at: [300, -31, -1] }
  - setblock: { block: stone, at: [312, -55, 0] }

  # LowAirDiver: the same column under a bedrock overhang, which no tool can
  # dig, and a sealed bedrock water pocket where its air drains first.
  - fill: { block: deepslate, from: [392, -55, -8], to: [408, -55, 8] }
  - fill: { block: deepslate, from: [399, -20, -1], to: [401, -20, 1] }
  - setblock: { block: water, at: [400, -20, 0] }
  - fill: { block: "water[level=8]", from: [400, -54, 0], to: [400, -21, 0] }
  - setblock: { block: bedrock, at: [400, -31, -1] }
  - fill: { block: bedrock, from: [403, -41, -1], to: [405, -37, 1] }
  - fill: { block: water, from: [404, -40, 0], to: [404, -38, 0] }
  - setblock: { block: stone, at: [412, -55, 0] }

entities:
  # Its air supply is far larger than any player's: the reflex must read the
  # bot's own air, not a neighbour's.
  - type: dolphin
    pos: [8.5, -58, 2.5]
    nbt: "{NoAI:1b,Invulnerable:1b,PersistenceRequired:1b,Air:6000s}"

players:
  - name: SealedDiver
    pos: [-2.5, -54, -2.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
  - name: DeepIdler
    pos: [100.5, -52, 0.5]
  - name: ShallowIdler
    pos: [200.5, -55, 12.5]
  - name: OffsetDiver
    pos: [312.5, -54, 0.5]
    inventory:
      - { item: diamond_pickaxe, count: 1 }
  - name: LowAirDiver
    pos: [412.5, -54, 0.5]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/idle.ts]
params:
  # The longest legacy window, sixty seconds for the sealed chamber, for every
  # pen: a pen whose driver returned early would sit in the water with its
  # reflexes closed until the last pen finished.
  waitTicks: 1200

tick:
  - "gamemode spectator @a[name=!SealedDiver,name=!DeepIdler,name=!ShallowIdler,name=!OffsetDiver,name=!LowAirDiver,gamemode=!spectator]"
  - "execute as @a[name=LowAirDiver] store result score @s ml_air run data get entity @s Air"

schedule:
  - afterTicks: 0
    run:
      - "tp SealedDiver 2.5 -59 2.5"
      - "tp DeepIdler 116.5 -59 5.5"
      - "tp ShallowIdler 200.5 -60 0.5"
      # The recorded fractional position, translated with the column.
      - "tp OffsetDiver 300.02621917259805 -40 0.08979961991747"
      - "tp LowAirDiver 404.5 -40 0.5"
      # A tag left on a reused player by an earlier trial must not count.
      - "tag LowAirDiver remove ml_released"
  # Released under the overhang with 120 of 300 air: rising alone cannot
  # breathe there and digging cannot open bedrock.
  - afterTicks: 1
    when: "entity @a[name=LowAirDiver,scores={ml_air=..120}]"
    run:
      - "tp LowAirDiver 400.02621917259805 -36 0.08979961991747"
      - "tag LowAirDiver add ml_released"

goal:
  kind: all
  timeout: 120
  goals:
    - { kind: health, who: SealedDiver, health: 14 }
    - { kind: survive, who: SealedDiver, seconds: 40 }
    - { kind: completion, who: SealedDiver }
    # The legacy pool allowed at most two health lost.
    - { kind: health, who: DeepIdler, health: 18 }
    - { kind: survive, who: DeepIdler, seconds: 40 }
    - { kind: completion, who: DeepIdler }
    - { kind: health, who: ShallowIdler, health: 18 }
    - { kind: survive, who: ShallowIdler, seconds: 25 }
    - { kind: completion, who: ShallowIdler }
    - { kind: health, who: OffsetDiver, health: 14 }
    - { kind: survive, who: OffsetDiver, seconds: 40 }
    - { kind: completion, who: OffsetDiver }
    # The release really happened: the low-air start is part of the arrangement.
    - { kind: entityCount, entity: player, tag: ml_released, min: 1 }
    - { kind: health, who: LowAirDiver, health: 14 }
    - { kind: survive, who: LowAirDiver, seconds: 40 }
    - { kind: completion, who: LowAirDiver }
