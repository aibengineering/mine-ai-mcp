template: ../../templates/combat-idle-midnight.yaml

tags: [acceptance, regression]
description: >-
  Three wounded idle bots, one per pen and 100 blocks apart, each stand
  between two native ranged attackers on a bedrock pad and request nothing;
  each must survive and recover to 18 health. At 10 health without a shield
  and with no blocks at all, on ground that cannot be dug, under blazes
  eighteen blocks either side; at 10 health between bow skeletons twelve
  blocks either side; and at 5 health under blazes with soul fire burning in
  all four cells around it. The blaze pen with blocks and the burning pen are
  known-failing/combat/wounded-ranged-shelter-flaky.

# Midnight with natural regeneration switched on at the start: recovery is the
# outcome. Each pen is a 17x17 bedrock pad in the superflat ground.
# The world declares it off so the wounds hold while Mine Labs arranges them;
# the first schedule entry turns it on, as the absorbed drivers did once
# their wound was in place. Fixtures sharing this world declare it again.
#   x:    0          100          200
#   z 0:                          Unbuildable
#   z100: Skeleton   SoulFire
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

geometry:
  - fill: { block: bedrock, from: [192, -61, -8], to: [208, -61, 8] }
  - fill: { block: bedrock, from: [-8, -61, 92], to: [8, -61, 108] }
  - fill: { block: bedrock, from: [92, -61, 92], to: [108, -61, 108] }
  - fill: { block: soul_soil, from: [99, -61, 99], to: [101, -61, 101] }
  - setblock: { at: [99, -60, 100], block: soul_fire }
  - setblock: { at: [101, -60, 100], block: soul_fire }
  - setblock: { at: [100, -60, 99], block: soul_fire }
  - setblock: { at: [100, -60, 101], block: soul_fire }

entities:
  - { type: blaze, pos: [218.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_unbuildable"]}' }
  - { type: blaze, pos: [182.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_unbuildable"]}' }
  - type: skeleton
    pos: [12.5, -60, 100.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}],Tags:["pen_skeleton"]}'
  - type: skeleton
    pos: [-11.5, -60, 100.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}],Tags:["pen_skeleton"]}'
  - { type: blaze, pos: [118.5, -60, 100.5], nbt: '{PersistenceRequired:1b,Tags:["pen_soul"]}' }
  - { type: blaze, pos: [82.5, -60, 100.5], nbt: '{PersistenceRequired:1b,Tags:["pen_soul"]}' }

schedule:
  - { afterTicks: 0, run: "gamerule naturalRegeneration true" }

players:
  - name: Unbuildable
    pos: [200.5, -60, 0.5]
    health: 10
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: golden_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cooked_beef, count: 32 }
  - name: SkeletonShelter
    pos: [0.5, -60, 100.5]
    health: 10
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: golden_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
      - { item: cooked_beef, count: 32 }
  - name: SoulFire
    pos: [100.5, -60, 100.5]
    health: 5
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: golden_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
      - { item: cooked_beef, count: 32 }

params:
  waitTicks: 1600

tick:
  - "gamemode spectator @a[name=!Unbuildable,name=!SkeletonShelter,name=!SoulFire,gamemode=!spectator]"

goal:
  kind: all
  timeout: 150
  goals:
    - { kind: health, who: Unbuildable, health: 18 }
    - { kind: survive, who: Unbuildable, seconds: 1 }
    - { kind: completion, who: Unbuildable }

    - { kind: health, who: SkeletonShelter, health: 18 }
    - { kind: survive, who: SkeletonShelter, seconds: 1 }
    - { kind: completion, who: SkeletonShelter }

    - { kind: health, who: SoulFire, health: 18 }
    - { kind: survive, who: SoulFire, seconds: 1 }
    - { kind: completion, who: SoulFire }
