template: ../../templates/combat-idle-midnight.yaml

tags: [acceptance, regression]
description: >-
  Six idle bots, one per pen and 100 blocks apart, each meet creepers and
  request nothing; no blast may reach a bot that should not have taken one.
  Armoured, the reflex kills a pair from fourteen blocks with a bow and sword,
  one from twelve with a sword alone, and one already inside contact range with
  a stone staircase behind the bot (the hillside double explosion, whose
  retreat ended at the first step up), each keeping 15 health. A sword-only bot
  facing a pair takes no damage at all (the live pair that took a fighting bot
  from 18 to 11 to 4), nor does a bare-handed bot facing one creeper, nor an
  unarmed bot two blocks from a lit fuse with a husk standing behind it.

# Pens on a 100-block grid of open superflat ground; every creeper here walks
# in from inside its own sixteen-block follow range.
#   x:    0         100         200
#   z 0:  PairBow   PairEvade   Stair
#   z100: Sword     Unarmed     LiveFuse
geometry:
  # Stair pen: stone rising away from the creeper, starting directly behind
  # the bot, so the only way clear of it is up the steps.
  - fill: { block: stone, from: [201, -60, -5], to: [214, -60, 5] }
  - fill: { block: stone, from: [203, -59, -5], to: [214, -59, 5] }
  - fill: { block: stone, from: [205, -58, -5], to: [214, -58, 5] }
  - fill: { block: stone, from: [207, -57, -5], to: [214, -57, 5] }
  - fill: { block: stone, from: [209, -56, -5], to: [214, -56, 5] }

entities:
  # From sixteen blocks a walking creeper gives a bow three or four full draws.
  - { type: creeper, pos: [14.5, -60, -1.5], nbt: '{PersistenceRequired:1b,Tags:["pen_pairbow"]}' }
  - { type: creeper, pos: [14.5, -60, 2.5], nbt: '{PersistenceRequired:1b,Tags:["pen_pairbow"]}' }
  # Abreast, outside the eight-block contact boundary so the decision is made
  # on arrival. Closing on either starts both fuses, and a sword can reset
  # only one of them, so a bot without a bow does not close.
  - { type: creeper, pos: [112.5, -60, -1.5], nbt: '{PersistenceRequired:1b,Tags:["pen_paire"]}' }
  - { type: creeper, pos: [112.5, -60, 2.5], nbt: '{PersistenceRequired:1b,Tags:["pen_paire"]}' }
  # From the open side and already inside contact range: spawned farther out
  # it is met on the flat, and the stairs never matter.
  - { type: creeper, pos: [195.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_stair"]}' }
  - { type: creeper, pos: [12.5, -60, 100.5], nbt: '{PersistenceRequired:1b,Tags:["pen_sword"]}' }
  - { type: creeper, pos: [112.5, -60, 100.5], nbt: '{PersistenceRequired:1b,Tags:["pen_unarmed"]}' }
  # A fuse already burning two blocks east, and a husk that cannot move one
  # block west: crowd separation alone would steer the escape into the fuse.
  - { type: creeper, pos: [202.5, -60, 100.5], nbt: '{Fuse:30,ignited:1b,PersistenceRequired:1b,Tags:["pen_fuse"]}' }
  - { type: husk, pos: [199.5, -60, 100.5], nbt: '{NoAI:1b,PersistenceRequired:1b,Tags:["pen_fuse"]}' }

players:
  - name: PairBow
    pos: [0.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: iron_sword, count: 1 }
  - name: PairEvade
    pos: [100.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: iron_sword, count: 1 }
  - name: StairBot
    pos: [200.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: iron_sword, count: 1 }
  - name: SwordBot
    pos: [0.5, -60, 100.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: iron_sword, count: 1 }
  # Healthy but bare-handed: fists cannot knock a creeper clear of its fuse.
  - name: UnarmedBot
    pos: [100.5, -60, 100.5]
    inventory:
      - { item: dirt, count: 3 }
  - name: FuseBot
    pos: [200.5, -60, 100.5]

params:
  # Every fight settled within 25 seconds in the first passing run.
  waitTicks: 1200

tick:
  - "gamemode spectator @a[name=!PairBow,name=!PairEvade,name=!StairBot,name=!SwordBot,name=!UnarmedBot,name=!FuseBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 180
  goals:
    - { kind: kill, who: PairBow, target: creeper, tag: pen_pairbow }
    - { kind: health, who: PairBow, health: 15 }
    - { kind: survive, who: PairBow, seconds: 1 }
    - { kind: completion, who: PairBow }

    - { kind: health, who: PairEvade, health: 20 }
    - { kind: survive, who: PairEvade, seconds: 1 }
    - { kind: completion, who: PairEvade }

    - { kind: kill, who: StairBot, target: creeper, tag: pen_stair }
    - { kind: health, who: StairBot, health: 15 }
    - { kind: survive, who: StairBot, seconds: 1 }
    - { kind: completion, who: StairBot }

    - { kind: kill, who: SwordBot, target: creeper, tag: pen_sword }
    - { kind: health, who: SwordBot, health: 15 }
    - { kind: survive, who: SwordBot, seconds: 1 }
    - { kind: completion, who: SwordBot }

    - { kind: health, who: UnarmedBot, health: 20 }
    - { kind: survive, who: UnarmedBot, seconds: 1 }
    - { kind: completion, who: UnarmedBot }

    - { kind: health, who: FuseBot, health: 20 }
    - { kind: survive, who: FuseBot, seconds: 1 }
    - { kind: completion, who: FuseBot }
