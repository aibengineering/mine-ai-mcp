template: ../../templates/single-action.yaml

tags: [acceptance, slow]
description: >-
  A whole native fight on seed 8675309: shoot every exposed crystal, climb the
  staircase to melee the two caged ones, then prepare and attack successive
  perches until the dragon dies, and live. The perch half starts from the
  zero-crystal state the bot made itself, which the legacy dragon-perch fixture
  arranged by command. The recorded first-entry loadout fights the same way in
  known-failing/combat/ender-dragon-first-entry.yaml.

world:
  type: default
  dimension: the_end
  seed: "8675309"
  difficulty: normal
  gamerules: { doMobSpawning: false }

players:
  - name: DragonFighter
    pos: [12.5, 64, 0.5]
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: diamond_boots }
    inventory:
      - { item: diamond_sword }
      - { item: diamond_pickaxe }
      - { item: bow }
      - { item: arrow, count: 128 }
      - { item: cooked_beef, count: 64 }
      - { item: end_stone, count: 256 }
      - { item: water_bucket }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/end-fight.ts]
params:
  arranged: { crystals: 10 }
  crystals: { plan: mixed }
  dragon: { attack: perch }

goal:
  kind: all
  timeout: 2400
  goals:
    - { kind: kill, target: ender_dragon }
    - { kind: entityCount, entity: end_crystal, max: 0 }
    - { kind: survive, who: DragonFighter, seconds: 1 }
    - { kind: completion, who: DragonFighter }
