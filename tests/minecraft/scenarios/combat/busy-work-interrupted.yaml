template: ../../templates/flat-single-action.yaml

tags: [acceptance]
description: >-
  A hostile walks up behind a bot that is busy with something other than
  travel, and the bot must deal with it and still finish the job. DigBot
  collects 28 stone while a zombie approaches from behind; its collection must
  record a hostile-response interruption, so finishing before the zombie
  arrives cannot pass. DigCreeperBot collects the same 28 stone at a face
  three blocks nearer while a creeper comes up behind it, where sprinting
  straight away runs into the rock: it must finish with fifteen health and no
  crater in the floor behind it. Both must survive.

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

# The two stone faces are two hundred blocks apart, beyond view distance, so
# neither collection counts the other's stone.
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill 6 -60 -6 14 -55 6 air"
  - "fill 203 -60 -6 211 -55 6 air"
  - "fill 190 -61 -3 202 -61 3 grass_block"

setup:
  - "difficulty normal"
  - "scoreboard objectives add pens dummy"
  - "scoreboard players set #creeper_stone pens 0"
  - "scoreboard players set #creeper_done pens 0"

# The delayed approach gives each bot time to begin collection. The expected
# interruption proves combat took over during that action, rather than afterwards.
geometry:
  - fill: { block: stone, from: [8, -60, -3], to: [11, -57, 3] }
  # The zombie face, three blocks nearer: a retreat from a creeper that
  # arrived from behind runs into the rock being dug.
  - fill: { block: stone, from: [205, -60, -3], to: [208, -57, 3] }

entities:
  - type: zombie
    # Behind the bot, so the dig is what the reflex interrupts, not an approach.
    # Fourteen blocks: at twenty-four the bot had finished twelve stone before
    # the zombie closed the distance it had walked away from it.
    pos: [-14.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"
  - type: creeper
    # A creeper follows from sixteen blocks, not a zombie's thirty-five:
    # outside the eight-block contact boundary at spawn, and still inside its
    # own follow range once the bot stands at the face.
    pos: [190.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["creeper_pen"]}'

players:
  - name: DigBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
  - name: DigCreeperBot
    pos: [200.5, -60, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
      - { item: iron_sword, count: 1 }

params:
  players:
    DigBot:
      action: collect_block
      expect: { status: succeeded, interruptionContains: "[HOSTILE_CONTACT]" }
      input:
        block_name: stone
        # Twenty-eight stone is roughly twenty-five seconds of walking and digging;
        # twelve was over in ten, before the zombie arrived.
        count: 28
        scaffold: false
    DigCreeperBot:
      action: collect_block
      input: { block_name: stone, count: 28, scaffold: false }

tick:
  - "gamemode spectator @a[name=!DigBot,name=!DigCreeperBot,gamemode=!spectator]"
  # Two seconds after DigCreeperBot holds its stone its request has returned,
  # and a creeper still standing is removed rather than left beside a body
  # with no reflexes. `clear ... 0` counts without removing.
  - "execute store result score #creeper_stone pens run clear DigCreeperBot minecraft:cobblestone 0"
  - "execute if score #creeper_stone pens matches 28.. run scoreboard players add #creeper_done pens 1"

schedule:
  - { when: "score #creeper_done pens matches 40..", run: "kill @e[tag=creeper_pen]" }

goal:
  kind: all
  timeout: 120
  goals:
    - kind: hasItem
      who: DigBot
      item: cobblestone
      count: 28
    # Mine Labs checks the server death count, including deaths during collection.
    - kind: survive
      who: DigBot
      seconds: 1
    - kind: completion
      who: DigBot
    - { kind: hasItem, who: DigCreeperBot, item: cobblestone, count: 28 }
    # Enough health to show the job was finished safely, not merely survived.
    - { kind: health, who: DigCreeperBot, health: 15 }
    # A blast behind the bot craters this floor.
    - kind: blocksAt
      block: grass_block
      positions: [[195,-61,-1],[195,-61,0],[195,-61,1],[196,-61,-1],[196,-61,0],[196,-61,1],[197,-61,-1],[197,-61,0],[197,-61,1],[198,-61,-1],[198,-61,0],[198,-61,1],[199,-61,-1],[199,-61,0],[199,-61,1],[200,-61,-1],[200,-61,0],[200,-61,1],[201,-61,-1],[201,-61,0],[201,-61,1]]
    - { kind: survive, who: DigCreeperBot, seconds: 1 }
    - { kind: completion, who: DigCreeperBot }
