template: ../../templates/flat-single-action.yaml

tags: [acceptance, regression]
description: >-
  Eight enderman hunts, one pen each, with every kind of protection and supply:
  a roof it must build from sixteen cobblestone (Constructed), a narrow
  two-high alcove and nothing to build with (Alcove), a roof already over its
  head (NoApproach), an enderman raised on a stone stair (Stairs), a pair with
  only eleven blocks, one shelter's worth (ShelterPair), a close native pair
  met in diamond armour with seventeen netherrack (ClosePair), and a low roof
  nearby with a bow in the kit (Pearl). Each pen must kill its endermen and
  survive, and every single-enderman pen must pick up the pearl its quarry is
  made to carry; Stairs must keep ten
  health and ClosePair twelve, with no regeneration. In the eighth pen
  (Obstructed) the model forbids digging and placing, and two endermen are
  sealed in a cobblestone box: the hunt must report that it failed, change no
  block, and survive.

# Pens two hundred blocks apart along x, beyond entity tracking, so no hunt
# sees another pen's endermen. Every coordinate stays within z -8..7 so the
# whole line fits the chunks Minecraft will pin.
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    # Off, so a final health goal is also the lowest health of the fight.
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -10 -60 -8 14 -50 7 air"
  - "fill 190 -60 -8 214 -50 7 air"
  - "fill 390 -60 -8 414 -50 7 air"
  - "fill 590 -60 -8 614 -50 7 air"
  - "fill 790 -60 -8 814 -50 7 air"
  - "fill 990 -60 -8 1014 -50 7 air"
  - "fill 1190 -60 -8 1214 -50 7 air"
  - "fill 1390 -60 -8 1414 -50 7 air"
  - "fill 600 -61 0 600 -61 0 grass_block"

setup:
  - "scoreboard objectives add pens dummy"
  - "scoreboard players set #pair_pearls pens 0"
  - "scoreboard players set #pair_settled pens 0"

geometry:
  # Alcove: a two-high stone nook west of the bot, open to the east.
  - fill: { block: stone, from: [199, -60, -1], to: [201, -59, 1] }
  - fill: { block: air, from: [200, -60, 0], to: [201, -59, 0] }
  - fill: { block: stone, from: [200, -58, 0], to: [201, -58, 0] }
  # NoApproach: a cobblestone roof directly over the start.
  - fill: { block: cobblestone, from: [399, -58, -1], to: [401, -58, 1] }
  # Obstructed: the same roof, and a sealed cobblestone box on a stone floor
  # holding two pinned endermen.
  - fill: { block: stone, from: [604, -61, -3], to: [610, -61, 3] }
  - fill: { block: cobblestone, from: [599, -58, -1], to: [601, -58, 1] }
  - fill: { block: cobblestone, from: [604, -60, -3], to: [610, -56, 3] }
  - fill: { block: air, from: [605, -60, -2], to: [609, -57, 2] }
  # Stairs: four stone steps rising east to a platform four up.
  - fill: { block: stone, from: [801, -60, -4], to: [809, -60, 4] }
  - fill: { block: stone, from: [802, -59, -4], to: [809, -59, 4] }
  - fill: { block: stone, from: [803, -58, -4], to: [809, -58, 4] }
  - fill: { block: stone, from: [804, -57, -4], to: [809, -57, 4] }
  # Pearl: a low cobblestone roof a few steps west.
  - fill: { block: cobblestone, from: [1396, -58, -1], to: [1398, -58, 1] }

# Every enderman hunted alone holds a pearl with a drop chance above one, so
# its kill always yields one and the hunt can only finish by killing.
entities:
  - type: enderman
    pos: [7.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["constructed"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  - type: enderman
    pos: [207.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["alcove"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  - type: enderman
    pos: [406.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["noapproach"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  - type: enderman
    pos: [606.5, -60, 0.5]
    nbt: '{NoAI:1b,PersistenceRequired:1b,Tags:["obstructed"]}'
  - type: enderman
    pos: [607.5, -60, 0.5]
    nbt: '{NoAI:1b,PersistenceRequired:1b,Tags:["obstructed"]}'
  - type: enderman
    pos: [806.5, -56, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["stairs"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  # The pair carries only its own loot, at most one pearl each, and is asked
  # for three: the hunt has to clear both and then report the shortfall.
  - type: enderman
    pos: [1006.5, -60, -2.5]
    nbt: '{PersistenceRequired:1b,Tags:["shelterpair"]}'
  - type: enderman
    pos: [1006.5, -60, 2.5]
    nbt: '{PersistenceRequired:1b,Tags:["shelterpair"]}'
  # The close pair, as the live bot met it: one almost touching, one six off.
  - type: enderman
    pos: [1200.5, -60, 1.03]
    nbt: '{PersistenceRequired:1b,Tags:["closepair"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  - type: enderman
    pos: [1200.8, -60, 6.7]
    nbt: '{PersistenceRequired:1b,Tags:["closepair"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'
  - type: enderman
    pos: [1407.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,Tags:["pearl"],HandItems:[{id:"minecraft:ender_pearl",count:1},{}],HandDropChances:[2.0f,0.0f]}'

players:
  - name: Constructed
    pos: [0.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 16 }
  - name: Alcove
    pos: [202.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
  - name: NoApproach
    pos: [400.5, -60, 0.5]
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 64 }
  - name: Obstructed
    pos: [600.5, -60, 0.5]
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 64 }
  - name: Stairs
    pos: [800.5, -60, 0.5]
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: diamond_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 64 }
  - name: ShelterPair
    pos: [1000.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 11 }
  # The original kit carried no shield, which the hunt now refuses for
  # hostile quarry; the shield is worn so the hunt is admitted.
  - name: ClosePair
    pos: [1200.5, -60, 0.5]
    equipment:
      head: diamond_helmet
      chest: diamond_chestplate
      legs: diamond_leggings
      feet: golden_boots
      offhand: shield
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: netherrack, count: 17 }
      - { item: cooked_beef, count: 36 }
  - name: Pearl
    pos: [1400.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: bow, count: 1 }
      - { item: arrow, count: 16 }

# The policy step needs the live policy revision, which action-sequence reads
# from a reply; every other pen is one hunt. Each request waits until no
# reflex holds the body, and is then made once.
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  players:
    Constructed: &one
      idleWithinTicks: 400
      actions:
        - { action: collect_mob_drop, input: { mob_name: enderman, drop_name: ender_pearl, count: 1 } }
    Alcove: *one
    NoApproach: *one
    Stairs: *one
    Pearl: *one
    # One of the pair is the request, as it was live.
    ClosePair: *one
    ShelterPair:
      idleWithinTicks: 400
      actions:
        - action: collect_mob_drop
          input: { mob_name: enderman, drop_name: ender_pearl, count: 3 }
          expect: { status: [partial, failed] }
    Obstructed:
      idleWithinTicks: 400
      actions:
        - action: set_survival_policy
          input:
            operation: set
            changes: { combat: { terrain: { dig: false, place: false } } }
            lifetime: { kind: session }
            reason: Leave the terrain exactly as it is.
        # Sealed in cobblestone that may not be dug: a truthful hunt cannot
        # succeed. The stop reason is the runtime's to choose.
        - action: collect_mob_drop
          input: { mob_name: enderman, drop_name: ender_pearl, count: 1 }
          expect: { status: [partial, failed] }

tick:
  - "gamemode spectator @a[name=!Constructed,name=!Alcove,name=!NoApproach,name=!Obstructed,name=!Stairs,name=!ShelterPair,name=!ClosePair,name=!Pearl,gamemode=!spectator]"
  # ClosePair's request is one of the two; the other stays standing. Ten
  # seconds after it holds its pearl the hunt has returned, and the survivor
  # is removed rather than left beside a body with no reflexes.
  - "execute store result score #pair_pearls pens run clear ClosePair minecraft:ender_pearl 0"
  - "execute if score #pair_pearls pens matches 1.. run scoreboard players add #pair_settled pens 1"

schedule:
  - { when: "score #pair_settled pens matches 200..", run: "kill @e[type=enderman,tag=closepair]" }

goal:
  kind: all
  timeout: 240
  goals:
    - { kind: kill, target: enderman, tag: constructed }
    - { kind: hasItem, who: Constructed, item: ender_pearl, count: 1 }
    - { kind: survive, who: Constructed, seconds: 1 }
    - { kind: completion, who: Constructed }

    - { kind: kill, target: enderman, tag: alcove }
    - { kind: hasItem, who: Alcove, item: ender_pearl, count: 1 }
    - { kind: survive, who: Alcove, seconds: 1 }
    - { kind: completion, who: Alcove }

    - { kind: kill, target: enderman, tag: noapproach }
    - { kind: hasItem, who: NoApproach, item: ender_pearl, count: 1 }
    - { kind: survive, who: NoApproach, seconds: 1 }
    - { kind: completion, who: NoApproach }

    # Obstructed: both endermen still sealed in, the wall facing the bot and the
    # roof over it intact, nothing placed around it, its floor undug.
    - { kind: entityCount, entity: enderman, tag: obstructed, min: 2 }
    - kind: blocksAt
      block: cobblestone
      positions: [[604,-60,-3],[604,-60,-2],[604,-60,-1],[604,-60,0],[604,-60,1],[604,-60,2],[604,-60,3],[604,-59,-3],[604,-59,-2],[604,-59,-1],[604,-59,0],[604,-59,1],[604,-59,2],[604,-59,3],[604,-58,-3],[604,-58,-2],[604,-58,-1],[604,-58,0],[604,-58,1],[604,-58,2],[604,-58,3],[604,-57,-3],[604,-57,-2],[604,-57,-1],[604,-57,0],[604,-57,1],[604,-57,2],[604,-57,3],[604,-56,-3],[604,-56,-2],[604,-56,-1],[604,-56,0],[604,-56,1],[604,-56,2],[604,-56,3],[599,-58,-1],[599,-58,0],[599,-58,1],[600,-58,-1],[600,-58,0],[600,-58,1],[601,-58,-1],[601,-58,0],[601,-58,1]]
    - kind: blocksAt
      block: air
      positions: [[599,-60,-1],[599,-60,0],[599,-60,1],[600,-60,-1],[600,-60,1],[601,-60,-1],[601,-60,0],[601,-60,1],[599,-59,-1],[599,-59,0],[599,-59,1],[600,-59,-1],[600,-59,1],[601,-59,-1],[601,-59,0],[601,-59,1]]
    - { kind: blockAt, pos: [600, -61, 0], block: grass_block }
    - { kind: hasItem, who: Obstructed, item: cobblestone, count: 64, max: 64 }
    - { kind: survive, who: Obstructed, seconds: 1 }
    - { kind: completion, who: Obstructed }

    - { kind: kill, target: enderman, tag: stairs }
    - { kind: hasItem, who: Stairs, item: ender_pearl, count: 1 }
    - { kind: health, who: Stairs, health: 10 }
    - { kind: survive, who: Stairs, seconds: 1 }
    - { kind: completion, who: Stairs }

    - { kind: kill, target: enderman, tag: shelterpair }
    - { kind: survive, who: ShelterPair, seconds: 1 }
    - { kind: completion, who: ShelterPair }

    - { kind: hasItem, who: ClosePair, item: ender_pearl, count: 1 }
    - { kind: health, who: ClosePair, health: 12 }
    - { kind: survive, who: ClosePair, seconds: 1 }
    - { kind: completion, who: ClosePair }

    - { kind: kill, target: enderman, tag: pearl }
    - { kind: hasItem, who: Pearl, item: ender_pearl, count: 1 }
    - { kind: survive, who: Pearl, seconds: 1 }
    - { kind: completion, who: Pearl }
