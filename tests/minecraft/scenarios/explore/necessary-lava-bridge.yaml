template: ../../templates/spectator.yaml

name: exploration-necessary-lava-bridge
tags: [acceptance]
description: >-
  Extend the eastern frontier across an unavoidable lava trench. A higher placement
  cost must still permit bridging: leave a netherrack crossing, reach the far bank
  and finish with full health.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  difficulty: normal
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
geometry:
  - fill: { block: air, from: [ 1, -60, -32 ], to: [ 10, -59, 32 ] }
  - fill: { block: lava, from: [ 1, -61, -32 ], to: [ 10, -61, 32 ] }
  # Walls reach world-bottom: a shallow wall permits a legitimate tunnel beneath it.
  - fill: { block: bedrock, from: [ -8, -64, -1 ], to: [ 16, -30, -1 ] }
  - fill: { block: bedrock, from: [ -8, -64, 1 ], to: [ 16, -30, 1 ] }
  - fill: { block: bedrock, from: [ -8, -64, -1 ], to: [ -8, -30, 1 ] }
players:
  - name: BridgeExplorer
    pos: [ 0.5, -59, 0.5 ]
    inventory: [ { item: netherrack, count: 64 } ]
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/explore-frontier.ts
params: { heading: 90, chunks: 1 }
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: blockAt, block: netherrack, pos: [1, -60, 0] }
    - { kind: reach, who: BridgeExplorer, pos: [18, -59, 0.5], radius: 6 }
    - { kind: health, who: BridgeExplorer, health: 20 }
    - { kind: completion, who: BridgeExplorer }
