template: ../../templates/single-action.yaml

tags: [regression]
description: >-
  Craft six ender eyes from three blaze rods and seven pearls through blaze
  powder, a honey block that keeps its four glass bottles, and a cake that keeps
  its three buckets, then smelt sixteen raw iron on two coal at a placed furnace
  at the normal tick rate. The carried inventory must be exact afterwards: no
  rods, powder, honey bottles, milk or raw iron left, one pearl, every bottle
  and bucket returned, sixteen ingots. Guards the intermediate eye chain (a
  stuck grid or leftover powder), dropped recipe remainders, and the
  normal-speed smelting deadline and fuel boundary.
# Absorbs flat/craft/eye-chain, recipe-remainders (the remainder cases; the
# full-inventory refusal is pinned in src/world/crafting.test.ts) and
# smelt-batch-normal. craft/workshop keeps the 16 TPS batch; this one runs at 20.
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, randomTickSpeed: 0 }
reset: ["fill -4 -59 -4 6 -52 4 air"]
geometry:
  - fill: { block: stone, from: [-4, -60, -4], to: [6, -60, 4] }
  - setblock: { at: [3, -59, -1], block: crafting_table }
  - setblock: { at: [3, -59, 2], block: furnace }
players:
  - name: Chainer
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: blaze_rod, count: 3 }
      - { item: ender_pearl, count: 7 }
      - { item: honey_bottle, count: 4 }
      - { item: milk_bucket, count: 3 }
      - { item: sugar, count: 2 }
      - { item: egg, count: 1 }
      - { item: wheat, count: 3 }
      - { item: raw_iron, count: 16 }
      - { item: coal, count: 2 }
client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/recipe-chains.ts]
params:
  furnace: { x: 3, y: -59, z: 2 }
goal:
  kind: all
  timeout: 240
  goals:
    - { kind: hasItem, who: Chainer, item: ender_eye, count: 6, max: 6 }
    - { kind: hasItem, who: Chainer, item: ender_pearl, count: 1, max: 1 }
    - { kind: hasItem, who: Chainer, item: blaze_rod, count: 0, max: 0 }
    - { kind: hasItem, who: Chainer, item: blaze_powder, count: 0, max: 0 }
    - { kind: hasItem, who: Chainer, item: honey_block, count: 1, max: 1 }
    - { kind: hasItem, who: Chainer, item: glass_bottle, count: 4, max: 4 }
    - { kind: hasItem, who: Chainer, item: honey_bottle, count: 0, max: 0 }
    - { kind: hasItem, who: Chainer, item: cake, count: 1, max: 1 }
    - { kind: hasItem, who: Chainer, item: bucket, count: 3, max: 3 }
    - { kind: hasItem, who: Chainer, item: milk_bucket, count: 0, max: 0 }
    - { kind: hasItem, who: Chainer, item: iron_ingot, count: 16, max: 16 }
    - { kind: hasItem, who: Chainer, item: raw_iron, count: 0, max: 0 }
    - { kind: completion, who: Chainer }
