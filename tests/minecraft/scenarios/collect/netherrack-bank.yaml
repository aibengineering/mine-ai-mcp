template: ../../templates/single-action.yaml

tags: [acceptance, regression]
description: >-
  Collect 32 fast-breaking netherrack from a controlled bank carved into native
  Nether terrain, while reachable drops accumulate on lower ledges. The dense
  native netherrack in every loaded chunk is what the block scan walked during
  live request 124 (2026-09-08), when collection stalled physics for seconds at
  a time. Verify full health and at most 64 of the bank's 565 blocks removed;
  mining most of the bank cannot pass on the final inventory count alone. The
  physics-gap timing itself is pinned by src/world/loaded-block-scan.test.ts.

# Seed and coordinates of the legacy netherrack-loaded-scan fixture. The bank
# sits in a 13-block air pocket so its own blocks are the only reachable
# netherrack, while the surrounding generated terrain fills the scan.
world:
  type: default
  dimension: the_nether
  seed: "-5335131384818472281"
  difficulty: peaceful
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -6 60 -6 6 72 6 air"

geometry:
  - fill: { block: air, from: [-6, 60, -6], to: [6, 72, 6] }
  - fill: { block: bedrock, from: [-6, 60, -6], to: [6, 60, 6] }
  - fill: { block: netherrack, from: [-4, 61, -4], to: [4, 67, 4] }
  - fill: { block: air, from: [0, 64, 0], to: [0, 65, 0] }

players:
  - name: Collector
    pos: [0.5, 64, 0.5]
    inventory:
      - { item: diamond_pickaxe, count: 1 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/netherrack-bank.ts]
params:
  action: collect_block
  input:
    block_name: netherrack
    count: 32
    scaffold: false

goal:
  kind: all
  timeout: 120
  goals:
    - kind: hasItem
      who: Collector
      item: netherrack
      count: 32
    - kind: health
      who: Collector
      health: 20
    - kind: survive
      who: Collector
      seconds: 1
    - kind: completion
      who: Collector
