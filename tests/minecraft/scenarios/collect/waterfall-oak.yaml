# Keep the Approach copy's falling column against the cliff until it reaches
# the bank, rather than spilling sideways one block above it.
setup:
  - "fill 403 -57 -1 403 -54 1 stone"
  - "fill 404 -57 -1 404 -54 -1 stone"
  - "fill 404 -57 1 404 -54 1 stone"

schedule:
  - afterTicks: 100
    run:
      - "tp LiveCollector 0.36 -58 0.48"
      - "tp NoMaterial 200.36 -58 0.48"
      - "tp Approach 400.36 -59 -2.5"

players:
  - name: LiveCollector
    pos: [0.36, -58, 0.48]
    inventory: [{ item: dirt, count: 24 }]
  - name: NoMaterial
    pos: [200.36, -58, 0.48]
  - name: Approach
    pos: [400.36, -59, -2.5]
    inventory: [{ item: dirt, count: 24 }]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  players:
    LiveCollector:
      waitTicks: 110
      actions:
        - { action: collect_block, input: { block_name: logs, count: 6, scaffold: true } }
    NoMaterial:
      waitTicks: 110
      actions:
        - action: collect_block
          input: { block_name: logs, count: 6, scaffold: true }
          expect: { status: partial, errorContains: "liquid isolation needs" }
    Approach:
      waitTicks: 110
      actions:
        - { action: collect_block, input: { block_name: logs, count: 6, scaffold: true } }

tick:
  - "gamemode spectator @a[name=!LiveCollector,name=!NoMaterial,name=!Approach,gamemode=!spectator]"

goal:
  kind: all
  # Six barehand logs need tens of seconds; two minutes exposes the reported stall.
  timeout: 120
  goals:
    - { kind: hasItem, who: LiveCollector, item: oak_log, count: 6 }
    - { kind: health, who: LiveCollector, health: 20 }
    - { kind: completion, who: LiveCollector }
    - { kind: hasItem, who: Approach, item: oak_log, count: 6 }
    - { kind: health, who: Approach, health: 20 }
    - { kind: completion, who: Approach }
    # Some dry logs, never all six, and the stop happens beside the tree.
    - { kind: hasItem, who: NoMaterial, item: oak_log, count: 1, max: 5 }
    - { kind: reach, who: NoMaterial, pos: [200.5, -59, 1.5], radius: 16 }
    - { kind: health, who: NoMaterial, health: 20 }
    - { kind: completion, who: NoMaterial }
