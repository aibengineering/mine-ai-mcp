template: ../../templates/flat-single-action-no-regen.yaml

tags: [regression]
description: >-
  Collect the six logs of an oak standing beside a waterfall, at three copies of the live
  incident's bank two hundred blocks apart, with regeneration off. LiveCollector starts where
  the live bot stood, carrying dirt, and must take all six within two minutes; it used to take
  five and then walk off exploring. The waterfall reached the stance from which the route broke
  the last log, the body floated off its grass floor, and a dig priced at three seconds took
  fifteen and outlived its confirmation four times, so the log was given up; a body afloat over
  its stance's floor now lands on it before digging. Approach starts on the north
  bank of a copy whose falling column runs down the cliff to the bank, giving the live
  level-four flow at the trunk, and must isolate it with carried dirt and take all six within two
  minutes: the incident was a multi-minute stall at this tree. NoMaterial starts where the live
  bot stood and carries nothing, so it may take only the dry logs and must then report the
  missing isolation material as a partial result near the tree, rather than flooding or searching
  on. All three stay at full health.

# The bank geometry was read from the live site; (56,64,27) maps to (0,-58,0),
# and is copied 200 and 400 blocks east. The waterfall's source is the water block
# at the top of the cliff. As the legacy fixtures' preparation did, the flow
# settles for 100 ticks and each bot is then put back at its start, standing
# in the settled current, before it is asked.

