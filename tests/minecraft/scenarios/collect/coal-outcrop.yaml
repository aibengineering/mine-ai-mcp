template: ../../templates/flat-single-action.yaml
name: coal-outcrop
description: Mine five coal from the exposed face of a stone hillside.

geometry:
  - fill: { block: andesite, from: [-12, -60, -12], to: [18, -60, 12] }
  - fill: { block: stone, from: [5, -59, -5], to: [12, -54, 5] }
  - fill: { block: coal_ore, from: [5, -58, -2], to: [5, -57, 2] }
  - setblock: { block: coal_ore, at: [6, -58, 3] }

players:
  - name: Actor
    pos: [0, -59, 0]
    inventory:
      - { item: stone_pickaxe, count: 1 }

params:
  action: collect_block
  input:
    block_name: coal_ore
    count: 5
    scaffold: false

goal:
  kind: all
  timeout: 45
  goals:
    - { kind: hasItem, item: coal, count: 5 }
    - { kind: completion }
