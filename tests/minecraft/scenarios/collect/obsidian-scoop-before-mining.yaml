template: ../../templates/collect/single-action.yaml

name: obsidian-scoop-before-mining
tags: [acceptance]
description: Recover the water covering an obsidian target into the supplied empty bucket,
  seal the adjacent lava, and collect the obsidian. Finish with the water bucket, full
  health, and no recorded death.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -6 -61 -5 10 -54 5 air"]
geometry:
  - fill: { block: stone, from: [-5, -61, -4], to: [9, -60, 4] }
  - setblock: { block: obsidian, at: [2, -60, 0] }
  - setblock: { block: water, at: [3, -59, 0] }
  - setblock: { block: lava, at: [2, -60, 1] }
players:
  - name: DrainMiner
    pos: [0.5, -59, 0.5]
    inventory: [{ item: diamond_pickaxe, count: 1 }, { item: cobblestone, count: 32 }, { item: bucket, count: 1 }]
params:
  action: collect_block
  input:
    block_name: obsidian
    count: 1
    scaffold: false

goal:
  kind: all
  timeout: 90
  goals:
    - { kind: hasItem, who: DrainMiner, item: obsidian, count: 1 }
    - { kind: hasItem, who: DrainMiner, item: water_bucket, count: 1 }
    - { kind: survive, who: DrainMiner, seconds: 1 }
    - { kind: completion, who: DrainMiner }
    - { kind: health, who: DrainMiner, health: 20 }
