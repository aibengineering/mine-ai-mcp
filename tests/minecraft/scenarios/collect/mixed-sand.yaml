template: ../../templates/collect/single-action.yaml
name: mixed-sand
tags: [acceptance]
description: >-
  Collect all 15 sand blocks from a low bank and three tall columns using a
  shovel. All sections must be harvested and their drops collected, with full
  health at completion; clearing only the easy bank cannot pass.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
reset: ["fill -4 -59 -6 14 -52 6 air"]
geometry:
  - fill: { block: sandstone, from: [-4, -60, -6], to: [14, -60, 6] }
  # Six low blocks and nine column blocks: the request requires every section.
  - fill: { block: sand, from: [3, -59, -3], to: [5, -59, -2] }
  - fill: { block: sand, from: [5, -59, 2], to: [5, -57, 2] }
  - fill: { block: sand, from: [8, -59, 0], to: [8, -57, 0] }
  - fill: { block: sand, from: [11, -59, -2], to: [11, -57, -2] }
players:
  - name: Collector
    pos: [0.5, -59, 0.5]
    inventory: [{ item: iron_shovel, count: 1 }]
params:
  action: collect_block
  input: { block_name: sand, count: 15, scaffold: false }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: hasItem, who: Collector, item: sand, count: 15 }
    - { kind: health, who: Collector, health: 20 }
    - { kind: completion, who: Collector }
