template: ../../templates/flat-single-action.yaml
name: mixed-resource-site
tags: [acceptance]
description: >-
  Collect coal, iron, copper, diamonds, cobblestone, dirt and clay from one small
  worksite. Exposed veins, a stepped copper bank and a clay shoreline exercise
  tool selection, uneven approaches and materials that drop several items per block.

geometry:
  # Hide the flat world's dirt layers so the dirt request exercises the terrace.
  - fill: { block: bedrock, from: [-16, -63, -16], to: [20, -61, 16] }
  - fill: { block: andesite, from: [-12, -60, -12], to: [18, -60, 12] }
  # Exposed coal and iron faces, with a higher copper bank behind them.
  - fill: { block: stone, from: [4, -59, -5], to: [8, -56, 5] }
  - fill: { block: coal_ore, from: [4, -58, -4], to: [4, -58, -2] }
  - fill: { block: iron_ore, from: [4, -58, 1], to: [4, -58, 3] }
  - fill: { block: stone, from: [9, -59, -4], to: [9, -59, 4] }
  - fill: { block: stone, from: [10, -59, -4], to: [10, -58, 4] }
  - fill: { block: copper_ore, from: [11, -57, -2], to: [11, -57, 2] }
  # A small deepslate pocket requires the carried iron pickaxe for its diamonds.
  - fill: { block: deepslate, from: [5, -59, -12], to: [13, -53, -6] }
  - setblock: { block: diamond_ore, at: [5, -58, -10] }
  - setblock: { block: diamond_ore, at: [5, -57, -9] }
  - setblock: { block: diamond_ore, at: [5, -58, -8] }
  - fill: { block: dirt, from: [-5, -59, 4], to: [-2, -59, 7] }
  - fill: { block: dirt, from: [-5, -58, 5], to: [-4, -58, 7] }
  - fill: { block: clay, from: [4, -60, 8], to: [7, -60, 9] }
  # Leave a one-block bank: ordinary clay collection must not spend earlier
  # collections sealing water, which would invalidate the final inventory goals.
  - fill: { block: water, from: [4, -60, 11], to: [7, -60, 11] }

players:
  - name: Actor
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_pickaxe, count: 1 }
      - { item: iron_shovel, count: 1 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]
params:
  actions:
    - { action: collect_block, input: { block_name: coal_ore, count: 3, scaffold: false } }
    - { action: collect_block, input: { block_name: iron_ore, count: 3, scaffold: false } }
    - { action: collect_block, input: { block_name: copper_ore, count: 4, scaffold: false } }
    - { action: collect_block, input: { block_name: diamond_ore, count: 3, scaffold: false } }
    - { action: collect_block, input: { block_name: stone, count: 4, scaffold: false } }
    - { action: collect_block, input: { block_name: dirt, count: 4, scaffold: false } }
    - { action: collect_block, input: { block_name: clay, count: 8, scaffold: false } }

goal:
  kind: all
  timeout: 150
  goals:
    - { kind: hasItem, item: coal, count: 3 }
    - { kind: hasItem, item: raw_iron, count: 3 }
    - { kind: hasItem, item: raw_copper, count: 4 }
    - { kind: hasItem, item: diamond, count: 3 }
    - { kind: hasItem, item: cobblestone, count: 4 }
    - { kind: hasItem, item: dirt, count: 4 }
    - { kind: hasItem, item: clay_ball, count: 8 }
    - { kind: completion }
