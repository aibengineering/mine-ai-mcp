template: ../../templates/flat-single-action-no-regen.yaml

tags: [acceptance]
description: >-
  Collect three diamonds lying at the bottom of a fifty-two-block solid stone hill, starting on
  its grass top. The descent must cost no health: regeneration is off, so any fall or suffocation
  damage on the way down or back out leaves the bot below 20.

# The hill fills the column from the flat world's surface to y -7; the
# diamonds are one layer above its base.
reset:
  - "fill -10 -59 -10 10 -6 10 air"

geometry:
  - fill: { block: stone, from: [-10, -59, -10], to: [10, -7, 10] }
  - fill: { block: grass_block, from: [-10, -7, -10], to: [10, -7, 10] }
  - fill: { block: diamond_ore, from: [-1, -58, 0], to: [1, -58, 0] }

players:
  - name: Actor
    pos: [0.5, -6, 0.5]
    inventory:
      - { item: iron_pickaxe, count: 1 }

params:
  action: collect_block
  input: { block_name: diamond_ore, count: 3 }

goal:
  kind: all
  timeout: 120
  goals:
    - { kind: hasItem, item: diamond, count: 3 }
    - { kind: health, health: 20 }
    - { kind: completion }
