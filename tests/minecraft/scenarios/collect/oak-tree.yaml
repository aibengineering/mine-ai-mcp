template: ../../templates/flat-single-action.yaml
name: oak-tree
description: Fell two standing oaks, collecting all fourteen trunk logs.

geometry:
  - fill: { block: grass_block, from: [-12, -60, -12], to: [14, -60, 12] }
  # Separate canopies require a fresh approach to the second tree.
  - fill: { block: oak_leaves, from: [4, -54, -2], to: [8, -52, 2] }
  - fill: { block: oak_leaves, from: [5, -51, -1], to: [7, -51, 1] }
  - fill: { block: oak_log, from: [6, -59, 0], to: [6, -53, 0] }
  - fill: { block: oak_leaves, from: [4, -54, 6], to: [8, -52, 10] }
  - fill: { block: oak_leaves, from: [5, -51, 7], to: [7, -51, 9] }
  - fill: { block: oak_log, from: [6, -59, 8], to: [6, -53, 8] }

players:
  - name: Actor
    pos: [0, -59, 0]
    inventory:
      - { item: iron_axe, count: 1 }
      - { item: dirt, count: 16 }

params:
  action: collect_block
  input:
    block_name: logs
    count: 14
    scaffold: true

goal:
  kind: all
  timeout: 90
  goals:
    - { kind: hasItem, item: oak_log, count: 14 }
    - { kind: completion }
