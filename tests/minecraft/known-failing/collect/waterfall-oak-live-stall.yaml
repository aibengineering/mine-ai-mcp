schedule:
  - { afterTicks: 100, run: "tp LiveCollector 0.36 -58 0.48" }

players:
  - name: LiveCollector
    pos: [0.36, -58, 0.48]
    inventory: [{ item: dirt, count: 24 }]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]

params:
  waitTicks: 110
  actions:
    - { action: collect_block, input: { block_name: logs, count: 6, scaffold: true } }

tick:
  - "gamemode spectator @a[name=!LiveCollector,gamemode=!spectator]"

goal:
  kind: all
  # Six barehand logs need tens of seconds; two minutes exposes the reported stall.
  timeout: 120
  goals:
    - { kind: hasItem, who: LiveCollector, item: oak_log, count: 6 }
    - { kind: health, who: LiveCollector, health: 20 }
    - { kind: completion, who: LiveCollector }
