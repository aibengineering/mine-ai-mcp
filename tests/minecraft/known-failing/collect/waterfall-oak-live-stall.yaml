template: ../../templates/flat-single-action-no-regen.yaml

tags: [known-failing, regression]
description: >-
  Collect the six logs of an oak beside a waterfall, carrying dirt, from the position where the
  live bot stood: the live incident was a multi-minute stall at this tree. Observed 2026-10-20:
  the collection takes five logs, then leaves the tree and walks off exploring for another log
  (85 blocks away, still walking, in one retained run) until the two-minute budget runs out with
  oak_log 5/6 and the sixth log still standing. It failed this way on both runs of this fixture,
  on four runs of the pen this fixture was split from in collect/waterfall-oak, and once at a
  second copy of the site. The legacy flowing-water-tree fixture passed once at the same commit,
  so the sixth log is lost often but not always.

# The bank geometry was read from the live site; (56,64,27) maps to (0,-58,0).
# As the legacy flowing-water-tree preparation did, the flow settles for 100
# ticks and the bot is then put back at the incident position before it is asked.
reset:
  - "fill -12 -60 -12 12 -42 12 air"

