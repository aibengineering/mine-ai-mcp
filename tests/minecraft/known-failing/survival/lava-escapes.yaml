template: ../../templates/flat-single-action-no-regen.yaml

tags: [known-failing, regression]
description: >-
  LavaPoolBot is put in the middle of a 13x13 lava pool with nothing but
  cobblestone and no bank within the fire reflex's reach, so it has to place
  a step and climb out; regeneration is off. It does place the step and climb
  out, in about twelve ticks, but this pen cannot pass as written: lava hits
  for four on contact and again ten ticks later, and leaving it sets a
  fifteen-second burn, fifteen health, that only water ends, and the pool has
  none. The best possible ending is one health, after a single lava hit, and
  the health floor of two can never be met. In twelve 2026-10-21 trials it
  ended at exactly one health five times and burned to death after a second
  lava hit seven times. It needs a decision on the goal rather than a runtime
  fix. The pocket and dig pens that were split out with it are fixed and back
  in survival/fire-reflex.

# The idle bot waits on a dry bank and is teleported into the lava once the
# runtime is up; a tag set the first tick its body burns proves the lava
# reached it.
world:
  type: flat
  time: noon
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill 90 -61 -10 110 -50 10 air"

setup:
  - "scoreboard objectives add ml_fire dummy"

geometry:
  # A netherrack bed under the pool, its centre six blocks from every edge,
  # and a dry netherrack bank to the east where the bot waits.
  - fill: { block: netherrack, from: [91, -61, -9], to: [109, -61, 9] }
  - fill: { block: lava, from: [94, -60, -6], to: [106, -60, 6] }
  - fill: { block: netherrack, from: [107, -60, -9], to: [109, -60, 9] }

players:
  - name: LavaPoolBot
    pos: [108.5, -59, 0.5]
    inventory:
      - { item: cobblestone, count: 8 }

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/action-sequence.ts]
params:
  players:
    # The idle wait covers the escape and the whole residual burn after it.
    LavaPoolBot: { waitTicks: 400 }

schedule:
  - afterTicks: 0
    run:
      # A tag a reused player kept from an earlier trial must not count.
      - "tag @a remove ml_burned_LavaPoolBot"
      - "tp LavaPoolBot 100.5 -60 0.5"
  - { afterTicks: 1, when: "entity @a[name=LavaPoolBot,scores={ml_fire=1..}]", run: "tag LavaPoolBot add ml_burned_LavaPoolBot" }

tick:
  - "gamemode spectator @a[name=!LavaPoolBot,gamemode=!spectator]"
  - "execute as @a store result score @s ml_fire run data get entity @s Fire"

goal:
  kind: all
  timeout: 75
  goals:
    - { kind: entityCount, entity: player, tag: ml_burned_LavaPoolBot, min: 1 }
    - { kind: health, who: LavaPoolBot, health: 2 }
    - { kind: survive, who: LavaPoolBot, seconds: 1 }
    - { kind: completion, who: LavaPoolBot }
