template: ../../templates/flat-single-action-no-regen.yaml

tags: [known-failing, regression]
description: >-
  Five idle bots are dropped under water where rising straight up does not
  always reach air; nothing is requested, so each escape is the breath
  reflex's alone. PocketSwimmer is under an obsidian ceiling 1.2 blocks above
  its head, empty-handed, with air six blocks east. TunnelSwimmer is in a
  flooded one-by-two tunnel whose air lies fourteen blocks away round a
  corner. LidSwimmer carries a stone pickaxe that cannot mine its obsidian
  ceiling, with air four blocks east. SkylightSwimmer has a one-block air
  shaft in its ceiling four blocks east. DeepRiser is at the bottom of an
  eighteen-deep column open to the sky. Every bot must reach air and survive.
  With regeneration off, each health floor bounds the drowning taken. Covers
  what breath-reflex does not: air beyond the reflex's two-block lateral
  escape search, and a ceiling the bot cannot dig.
  Observed at f8e0965: the four roofed pens drown. In each, the breath reflex
  fires at air 18 with roof obsidian, holds jump and tries to hand-dig the
  obsidian it cannot harvest, finds no escape within two blocks, and keeps the
  body until the bot drowns about 25 s in. DeepRiser passes on the idle
  water-surface rise alone.

# Pens are 100 blocks apart along x. Every swimmer waits on a dry stand on its
# pen's roof, because the host prepares a grounded, still body; the schedule
# drops them all into the water on the first tick, so each starts with a full
# bar.
reset:
  - "fill -8 -60 -12 420 -30 16 air"

geometry:
  # PocketSwimmer: water -59..-57 under an obsidian ceiling at -56, and a
  # pocket at x 8..10 with air at -56 and -55 under a ceiling at -54.
  - fill: { block: obsidian, from: [-1, -60, -3], to: [11, -54, 3] }
  - fill: { block: water, from: [0, -59, -2], to: [7, -57, 2] }
  - fill: { block: water, from: [8, -59, -2], to: [10, -57, 2] }
  - fill: { block: air, from: [8, -56, -2], to: [10, -55, 2] }

  # TunnelSwimmer: a one-wide, two-high flooded tunnel east along z 0 to x 108,
  # north along x 108 to z 5, then a chamber whose water is one deep under air.
  - fill: { block: obsidian, from: [99, -60, -1], to: [110, -54, 9] }
  - fill: { block: water, from: [100, -59, 0], to: [108, -58, 0] }
  - fill: { block: water, from: [108, -59, 1], to: [108, -58, 5] }
  - fill: { block: water, from: [107, -59, 6], to: [109, -59, 8] }
  - fill: { block: air, from: [107, -58, 6], to: [109, -56, 8] }

  # LidSwimmer: PocketSwimmer's room, shorter, with the pocket at x 204..206.
  - fill: { block: obsidian, from: [199, -60, -3], to: [207, -54, 3] }
  - fill: { block: water, from: [200, -59, -2], to: [203, -57, 2] }
  - fill: { block: water, from: [204, -59, -2], to: [206, -57, 2] }
  - fill: { block: air, from: [204, -56, -2], to: [206, -55, 2] }

  # SkylightSwimmer: water -59..-57 under an obsidian ceiling at -56, broken by
  # a one-block air shaft at x 304 rising to the roof at -54.
  - fill: { block: obsidian, from: [299, -60, -3], to: [307, -54, 3] }
  - fill: { block: water, from: [300, -59, -2], to: [306, -57, 2] }
  - fill: { block: air, from: [304, -56, 0], to: [304, -55, 0] }

  # DeepRiser: a one-by-one stone column, water -59..-42, open to the sky.
  - fill: { block: stone, from: [399, -60, -1], to: [401, -41, 1] }
  - fill: { block: water, from: [400, -59, 0], to: [400, -42, 0] }
  - setblock: { block: air, at: [400, -41, 0] }

players:
  - name: PocketSwimmer
    pos: [2.5, -53, 0.5]
  - name: TunnelSwimmer
    pos: [101.5, -53, 4.5]
  - name: LidSwimmer
    pos: [201.5, -53, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
  - name: SkylightSwimmer
    pos: [301.5, -53, 0.5]
  - name: DeepRiser
    pos: [401.5, -40, 0.5]

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/idle.ts]
params:
  # Every pen holds its reflexes for the whole window; one that returned early
  # would sit in the water with them closed.
  waitTicks: 900

tick:
  - "gamemode spectator @a[name=!PocketSwimmer,name=!TunnelSwimmer,name=!LidSwimmer,name=!SkylightSwimmer,name=!DeepRiser,gamemode=!spectator]"

schedule:
  - afterTicks: 0
    run:
      - "tp PocketSwimmer 1.5 -59 0.5"
      - "tp TunnelSwimmer 100.5 -59 0.5"
      - "tp LidSwimmer 200.5 -59 0.5"
      - "tp SkylightSwimmer 300.5 -59 0.5"
      - "tp DeepRiser 400.5 -59 0.5"

goal:
  kind: all
  timeout: 90
  goals:
    # A bot that never reached air is dead within 25 seconds; surviving 40
    # proves the escape, and the health floor bounds what it cost.
    - { kind: survive, who: PocketSwimmer, seconds: 40 }
    - { kind: health, who: PocketSwimmer, health: 10 }
    - { kind: completion, who: PocketSwimmer }
    - { kind: survive, who: TunnelSwimmer, seconds: 40 }
    - { kind: health, who: TunnelSwimmer, health: 10 }
    - { kind: completion, who: TunnelSwimmer }
    - { kind: survive, who: LidSwimmer, seconds: 40 }
    - { kind: health, who: LidSwimmer, health: 10 }
    - { kind: completion, who: LidSwimmer }
    - { kind: survive, who: SkylightSwimmer, seconds: 40 }
    - { kind: health, who: SkylightSwimmer, health: 10 }
    - { kind: completion, who: SkylightSwimmer }
    - { kind: survive, who: DeepRiser, seconds: 40 }
    - { kind: health, who: DeepRiser, health: 18 }
    - { kind: completion, who: DeepRiser }
