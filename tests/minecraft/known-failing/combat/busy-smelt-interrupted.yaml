template: ../../templates/flat-single-action.yaml

tags: [known-failing, regression]
description: >-
  Smelt three raw iron at a placed furnace while a zombie walks up during the
  cook; the smelt must record the hostile-response interruption, then finish
  with three iron ingots and the bot alive. Observed failing (2026-10-20, as
  in the legacy run of 2026-10-19): about eleven seconds in, when the zombie
  is three blocks off, smelt_item returns cancelled with the runtime failure
  "[HOSTILE_CONTACT] fight response for zombie", instead of resuming the cook
  after the fight, so no ingot is produced. This
  is the smelting stage of combat/busy-work-interrupted, split out until an
  interrupted cook resumes.

# The old takeover watched only the pathfinder, so a long furnace wait with
# the window open was a blind spot. Three inputs are thirty seconds of vanilla
# cook, so a zombie walking in from twenty-four blocks lands inside the wait.
world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill 2 -60 0 2 -60 0 air"

setup:
  - "difficulty normal"

geometry:
  - setblock: { block: furnace, at: [2, -60, 0] }

entities:
  - type: zombie
    pos: [24.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: SmeltBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: raw_iron, count: 3 }
      - { item: coal, count: 1 }

params:
  action: smelt_item
  expect: { status: succeeded, interruptionContains: "[HOSTILE_CONTACT]" }
  input: { item_name: raw_iron, count: 3, fuel_item_name: coal, x: 2, y: -60, z: 0 }

tick:
  - "gamemode spectator @a[name=!SmeltBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - { kind: hasItem, who: SmeltBot, item: iron_ingot, count: 3 }
    - { kind: survive, who: SmeltBot, seconds: 1 }
    - { kind: completion, who: SmeltBot }
