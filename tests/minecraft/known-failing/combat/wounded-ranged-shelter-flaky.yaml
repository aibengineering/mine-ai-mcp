template: ../../templates/combat-idle-midnight.yaml

tags: [known-failing, regression]
description: >-
  Two wounded idle bots stand between two native blazes eighteen blocks either
  side on a bedrock pad, carrying cobblestone and beef, and must survive and
  recover to 18 health: one at 10 health without a shield, one with a shield
  arriving on fire from a lava touch (the burn that killed the equipped eyes
  trial). Both pens fail intermittently. Observed on 2026-10-20 as pens of
  combat/wounded-ranged-shelter: in tier run 11-42-04-903Z the burning bot
  "burned to a crisp while fighting Blaze"; in recheck 12-26-04-330Z the
  shieldless bot ended the window at 15.71 health. Each passed in five other
  runs of that fixture. Alone, this fixture failed in 12-54-49-633Z (the
  burning bot ended at 17.87) and passed in 12-51-34-722Z and 12-58-04-499Z.

# The two pens as they stood in combat/wounded-ranged-shelter, with that
# fixture's world: regeneration declared off so the wounds hold while Mine Labs
# arranges them, then switched on by the first schedule entry.
#   x:    0          100
#   z 0:  Blaze      Burning
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

geometry:
  - fill: { block: bedrock, from: [-8, -61, -8], to: [8, -61, 8] }
  - fill: { block: bedrock, from: [92, -61, -8], to: [108, -61, 8] }

entities:
  - { type: blaze, pos: [18.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_blaze"]}' }
  - { type: blaze, pos: [-17.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_blaze"]}' }
  - { type: blaze, pos: [118.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_burning"]}' }
  - { type: blaze, pos: [82.5, -60, 0.5], nbt: '{PersistenceRequired:1b,Tags:["pen_burning"]}' }

schedule:
  - { afterTicks: 0, run: "gamerule naturalRegeneration true" }
  # A native lava touch: two ticks in a lava cell set the bot burning for
  # fifteen seconds after the cell is cleared.
  - { afterTicks: 0, run: "setblock 100 -60 0 minecraft:lava" }
  - { afterTicks: 2, run: "setblock 100 -60 0 minecraft:air" }

players:
  - name: BlazeShelter
    pos: [0.5, -60, 0.5]
    health: 10
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: golden_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
      - { item: cooked_beef, count: 32 }
  # One point above the other: the lava touch costs about one through this
  # armour, so the response starts near 10 health and burning.
  - name: Burning
    pos: [100.5, -60, 0.5]
    health: 11
    equipment: { head: diamond_helmet, chest: diamond_chestplate, legs: diamond_leggings, feet: golden_boots }
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
      - { item: shield, count: 1 }
      - { item: cooked_beef, count: 32 }

params:
  waitTicks: 1600

tick:
  - "gamemode spectator @a[name=!BlazeShelter,name=!Burning,gamemode=!spectator]"

goal:
  kind: all
  timeout: 150
  goals:
    - { kind: health, who: BlazeShelter, health: 18 }
    - { kind: survive, who: BlazeShelter, seconds: 1 }
    - { kind: completion, who: BlazeShelter }

    - { kind: health, who: Burning, health: 18 }
    - { kind: survive, who: Burning, seconds: 1 }
    - { kind: completion, who: Burning }
