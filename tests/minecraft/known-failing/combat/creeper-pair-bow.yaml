template: ../../templates/combat-idle-midnight.yaml

tags: [known-failing, regression]
description: >-
  An armoured idle bot with a bow, 32 arrows and an iron sword faces two
  creepers walking in abreast from fourteen blocks, and must kill both while
  keeping 15 health (the absorbed idle-creeper-pair-bow-fight). Observed on
  2026-10-20 as a pen of combat/creeper-reflex, in five runs out of five: tier
  run 11-24-29-470Z and rechecks 12-24-12-826Z and 12-27-39-353Z at a 1200-tick
  window, and 12-34-58-666Z and 12-36-46-777Z at this fixture's 1800. The bot
  kills one creeper and ends at full health with the other alive: in
  12-34-58-666Z its hit-and-run carried it 22 blocks west, the encounter ended
  with the survivor 27 blocks off, beyond the sixteen-block hostile radius and
  the creeper's own follow range, and nothing brought them together again.
  Alone, this fixture failed the same way in 12-49-52-833Z and
  12-53-07-802Z, and passed in 12-32-44-707Z and 12-56-22-629Z.

# The pen as it stood in combat/creeper-reflex, at that fixture's origin.
entities:
  # From sixteen blocks a walking creeper gives a bow three or four full draws.
  - { type: creeper, pos: [14.5, -60, -1.5], nbt: '{PersistenceRequired:1b,Tags:["pen_pairbow"]}' }
  - { type: creeper, pos: [14.5, -60, 2.5], nbt: '{PersistenceRequired:1b,Tags:["pen_pairbow"]}' }

players:
  - name: PairBow
    pos: [0.5, -60, 0.5]
    equipment: { head: iron_helmet, chest: iron_chestplate, legs: iron_leggings, feet: iron_boots }
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: iron_sword, count: 1 }

params:
  # The absorbed fixture's window.
  waitTicks: 1800

tick:
  - "gamemode spectator @a[name=!PairBow,gamemode=!spectator]"

goal:
  kind: all
  timeout: 150
  goals:
    - { kind: kill, who: PairBow, target: creeper, tag: pen_pairbow }
    - { kind: health, who: PairBow, health: 15 }
    - { kind: survive, who: PairBow, seconds: 1 }
    - { kind: completion, who: PairBow }
