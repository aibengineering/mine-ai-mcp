template: ../../templates/flat-single-action-no-regen.yaml

tags: [known-failing, regression]
description: >-
  Drop off a ledge into a bedrock cut and navigate through obsidian, digging, while a gated
  lava source beside the landing is released the moment the bot lands; native flow must not
  reach it. Fails today: the navigation is interrupted by the fire reflex ([FIRE]
  advancing_lava), the route stops with no path, and the bot burns to death about ten
  seconds later, unarmoured and at full health to start. The legacy
  lava-advances-during-dig fixture died the same way on 2026-10-19.

# The flowing-lava-course pens, minus this one, pass in the same world. The
# release is a one-shot schedule entry keyed to the bot's position as it falls
# past y -53 into the landing cell, not a driver action. Any settled status is
# acceptable; the bot is observed 340 ticks later with its reflexes live, and
# must be alive at full health.
reset:
  - "fill -6 -60 -6 6 -47 6 air"

geometry:
  - fill: { block: bedrock, from: [-5, -55, -5], to: [5, -55, 5] }
  - setblock: { block: deepslate, at: [0, -52, 1] }
  # Source and release gate.
  - fill: { block: bedrock, from: [-4, -54, -1], to: [-2, -53, 1] }
  - setblock: { block: lava, at: [-3, -54, 0] }
  - setblock: { block: stone, at: [-2, -54, 0] }
  # Long dig ahead of the landing. Bedrock prohibits climbing over or walking
  # around it, while the open area east allows a safe withdrawal.
  - fill: { block: bedrock, from: [-1, -54, -4], to: [1, -50, -1] }
  - fill: { block: air, from: [0, -54, -3], to: [0, -53, -2] }
  - fill: { block: obsidian, from: [0, -54, -1], to: [0, -53, -1] }

schedule:
  - when: "entity @a[name=Digger,x=0,y=-54,z=0,dx=0,dy=0,dz=1]"
    run: "setblock -2 -54 0 air"

players:
  - name: Digger
    pos: [0.5, -51, 1.5]
    inventory: [{ item: diamond_pickaxe, count: 1 }]

tick:
  - "gamemode spectator @a[name=!Digger,gamemode=!spectator]"

client:
  command: bun
  cwd: ../..
  args: [client-host.ts, drivers/pathfinder-course.ts]
params:
  dig: true
  legs:
    - target: [0, -54, -3]
      range: 0.2
      label: "Dig through obsidian as the lava is released"
      expect: { status: [succeeded, partial, failed] }
      settleTicks: 340

goal:
  kind: all
  timeout: 60
  goals:
    - { kind: health, who: Digger, health: 20 }
    - { kind: completion, who: Digger }
    - { kind: survive, who: Digger, seconds: 1 }
