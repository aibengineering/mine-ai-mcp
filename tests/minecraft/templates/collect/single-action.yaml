# These cases keep their complete world arrangement and share only the client.
# params.action and params.input are interpreted by the single-action driver.
# cwd resolves from scenarios/collect/, not from this template.
spectator:
  mods:
    - { id: blockhighlighter, path: ../../../../.mine-labs/mods/blockhighlighter.jar }
  systemProperties:
    blockhighlighter.serverPortOffset: "10000"
client:
  command: bun
  cwd: ../..
  args:
    - client-host.ts
    - drivers/single-action.ts
