name: enderman-teleport-away
description: Switch from a selected Enderman teleported far away to a much nearer loaded alternative.
minecraft: { version: "1.21.4" }
world:
  type: default
  dimension: the_nether
  seed: 20260906
  difficulty: normal
  gamerules: { doMobSpawning: false, doDaylightCycle: false, naturalRegeneration: true }
geometry:
  - fill: { block: air, from: [94, 100, -6], to: [166, 105, 12] }
  - fill: { block: warped_nylium, from: [94, 99, -6], to: [166, 99, 12] }
entities:
  - { type: enderman, pos: [120.5, 100, 0.5], nbt: '{PersistenceRequired:1b,attributes:[{id:"minecraft:movement_speed",base:0.0d}],Tags:["reconsider_primary"]}' }
  - { type: enderman, pos: [126.5, 100, 6.5], nbt: '{PersistenceRequired:1b,attributes:[{id:"minecraft:movement_speed",base:0.0d}],Tags:["reconsider_alternative"]}' }
players:
  - name: EndermanRanking
    pos: [100.5, 100, 0.5]
    op: true
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: golden_boots, count: 1 }
      - { item: cooked_beef, count: 16 }
      - { item: cobblestone, count: 64 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./enderman-reconsideration.ts"]
params:
  mode: teleport_away
  primary: [120.5, 100, 0.5]
  alternative: [126.5, 100, 6.5]
  teleportTo: [160.5, 100, 0.5]
  expectedReason: selected target teleported
goal: { kind: completion, who: EndermanRanking, timeout: 120 }
