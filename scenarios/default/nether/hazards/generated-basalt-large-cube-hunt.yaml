name: generated-basalt-large-cube-hunt
description: Hunt a native large magma cube and its splitting offspring on a generated basalt shelf, then return with cream.
minecraft: { version: "1.21.4" }
world:
  type: default
  dimension: the_nether
  seed: 20260906
  difficulty: normal
  gamerules: { doMobSpawning: false, naturalRegeneration: true, keepInventory: false, randomTickSpeed: 0 }
entities:
  - { type: magma_cube, pos: [195.5, 49, -18.5], nbt: '{Size:3,NoAI:1b,PersistenceRequired:1b,Tags:["basalt_hunt"]}' }
players:
  - name: BasaltTraveler
    pos: [185.5, 49, -19.5]
    op: true
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: shield, count: 1 }
      - { item: diamond_helmet, count: 1 }
      - { item: diamond_chestplate, count: 1 }
      - { item: diamond_leggings, count: 1 }
      - { item: diamond_boots, count: 1 }
      - { item: cooked_beef, count: 16 }
      - { item: cobblestone, count: 64 }
client:
  command: bun
  args: ["../../../src/client-host.ts", "./generated-basalt-hunt.ts"]
goal:
  kind: all

  # Arrangement, native combat, loot pickup, return, and a three-second dwell.
  timeout: 180
  goals:
    - { kind: completion, who: BasaltTraveler }
    - { kind: hasItem, who: BasaltTraveler, item: magma_cream, count: 1 }
    - { kind: survive, who: BasaltTraveler, seconds: 1 }
    - { kind: health, who: BasaltTraveler, health: 1 }
