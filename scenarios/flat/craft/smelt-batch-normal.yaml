name: smelt-batch-normal
description: Smelt sixteen raw iron at the normal server tick rate with native furnace progress evidence.
minecraft: { version: "1.21.4" }
world: { type: flat, gamerules: { doMobSpawning: false } }
geometry:
  - fill: { block: stone, from: [-8, -60, -8], to: [8, -60, 8] }
  - setblock: { at: [2, -59, 0], block: furnace }
players:
  - name: SmeltNormalBot
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: raw_iron, count: 16 }
      - { item: coal, count: 2 }
params: { count: 16, temporary: false }
client: { command: bun, args: ["../../src/client-host.ts", "./smelt-batch.ts"] }
goal:
  kind: all
  timeout: 240
  goals:
    - { kind: completion, who: SmeltNormalBot }
    - { kind: hasItem, who: SmeltNormalBot, item: iron_ingot, count: 16 }
