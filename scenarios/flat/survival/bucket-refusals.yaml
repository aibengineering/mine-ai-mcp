name: bucket-native-refusals
description: Refuse native partial, liquid and body-edge geometry and actual Nether water use without moving or consuming water.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
geometry:
  - fill: { block: stone, from: [-3, -60, -3], to: [25, -60, 3] }
players:
  - name: BucketBot
    op: true
    pos: [0.5, -59, 0.5]
    inventory: [{ item: water_bucket, count: 1 }]
client:
  command: bun
  args: ["../../src/client-host.ts", "./bucket-refusals.ts"]
goal:
  kind: all
  timeout: 35
  goals:
    - { kind: health, who: BucketBot, health: 20 }
    - { kind: hasItem, who: BucketBot, item: water_bucket, count: 1 }
    - { kind: completion, who: BucketBot }
