name: bucket-fall-20
description: Survive a 20-block fall and recover the carried water without losing health.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0, keepInventory: true }
reset:
  - "fill -25 -59 -25 25 40 25 air"
geometry:
  - fill: { block: end_stone, from: [-25, -60, -25], to: [25, -60, 25] }
  - fill: { block: glass, from: [0, -40, 0], to: [0, -40, 0] }
players:
  - name: BucketBot
    op: true
    pos: [0.5, -39, 0.5]
    inventory:
      - { item: water_bucket, count: 1 }
params: {"impulse":null}
client:
  command: bun
  args: ["../../src/client-host.ts", "./bucket-fall.ts"]
goal:
  kind: all
  timeout: 25
  goals:
    - { kind: health, who: BucketBot, health: 20 }
    - { kind: hasItem, who: BucketBot, item: water_bucket, count: 1 }
    - { kind: completion, who: BucketBot }
