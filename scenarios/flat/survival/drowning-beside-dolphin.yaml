name: drowning-beside-dolphin
description: A roofed diver must surface for its own air while a nearby dolphin publishes a much larger air supply.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0
reset:
  - "fill -8 -61 -8 16 -48 8 air"
geometry:
  - fill: { block: stone, from: [-4, -60, -4], to: [12, -55, 8] }
  - fill: { block: water, from: [0, -59, 0], to: [4, -57, 4] }
  - fill: { block: water, from: [7, -59, 0], to: [10, -57, 4] }
entities:
  - type: dolphin
    pos: [8.5, -58, 2.5]
    nbt: "{NoAI:1b,Invulnerable:1b,PersistenceRequired:1b,Air:6000s}"
players:
  - name: Diver
    pos: [2.5, -59, 2.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./breath.ts"]
params:
  waitTicks: 1200
  minHealth: 14
goal:
  kind: all
  timeout: 90
  goals:
    - { kind: survive, who: Diver, seconds: 1 }
    - { kind: completion, who: Diver }
