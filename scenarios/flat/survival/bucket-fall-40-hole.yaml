name: bucket-fall-40-hole
description: Survive a 40-block fall and recover the carried water without losing health.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0, keepInventory: true }
reset:
  - "fill -60 -59 -15 60 135 15 air"
geometry:
  - fill: { block: end_stone, from: [-60, -60, -15], to: [60, -60, 15] }
  - fill: { block: glass, from: [0, -20, 0], to: [0, -20, 0] }
  - fill: { block: end_stone, from: [-2, -59, -2], to: [2, -55, 2] }
  - fill: { block: air, from: [0, -59, 0], to: [0, -55, 0] }
players:
  - name: BucketBot
    op: true
    pos: [0.5, -19, 0.5]
    inventory:
      - { item: iron_pickaxe, count: 1 }
      - { item: water_bucket, count: 1 }
params: {"name":"40-hole","height":40,"hole":true}
client:
  command: bun
  args: ["../../src/client-host.ts", "./bucket-fall.ts"]
goal:
  kind: all
  timeout: 25
  goals:
    - { kind: health, who: BucketBot, health: 20 }
    - { kind: hasItem, who: BucketBot, item: water_bucket, count: 1 }
    - { kind: completion, who: BucketBot }
