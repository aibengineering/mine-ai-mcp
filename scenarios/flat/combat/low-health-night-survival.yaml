name: low-health-night-survival
description: Survive twenty seconds at seven health with only building blocks, surrounded by eight zombies and one spider. Any strategy is allowed.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0

geometry:
  - fill: { block: stone, from: [-16, -60, -16], to: [16, -60, 16] }

players:
  - name: NightSurvivor
    pos: [0.5, -59, 0.5]
    # The driver uses /damage to establish low health before the measured window.
    op: true
    inventory:
      - { item: cobblestone, count: 64 }

# All mobs have normal AI. They activate after Mine Labs has prepared the player.
entities:
  - { type: zombie, pos: [8.5, -59, 0.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [6.5, -59, 6.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [0.5, -59, 8.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [-5.5, -59, 6.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [-7.5, -59, 0.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [-5.5, -59, -5.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [0.5, -59, -7.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: zombie, pos: [6.5, -59, -5.5], nbt: "{PersistenceRequired:1b,IsBaby:0b}" }
  - { type: spider, pos: [3.5, -59, 7.5], nbt: "{PersistenceRequired:1b}" }

client:
  command: bun
  args: ["../../src/client-host.ts", "./low-health-night-survival.ts"]

params:
  startingHealth: 7

goal:
  kind: all
  timeout: 60
  goals:
    # Server-observed deaths prevent respawning from satisfying this goal.
    - { kind: survive, who: NightSurvivor, seconds: 20 }
    # Confirms the full interval occurred after low-health and threat setup.
    - { kind: completion, who: NightSurvivor }
