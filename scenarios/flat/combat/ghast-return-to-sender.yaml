name: ghast-return-to-sender
description: A real ghast fires at the idle bot; the bot returns its projectile without leaving a narrow bridge.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -8 -60 -8 28 -40 8 air"
setup:
  - "difficulty normal"
geometry:
  - fill: { block: netherrack, from: [-2, -55, 0], to: [24, -55, 0] }
entities:
  - type: ghast
    pos: [20.5, -51.5, 0.5]
    nbt: "{PersistenceRequired:1b}"
players:
  - name: FireballBot
    pos: [0.5, -54, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./ghast-return-to-sender.ts"]
# Hold the shooter in one place to isolate its real shot and the return strike.
# Its attack AI, projectile physics, damage and death remain vanilla.
tick:
  - "tp @e[type=minecraft:ghast] 20.5 -51.5 0.5"
goal:
  kind: all
  timeout: 45
  goals:
    - { kind: health, who: FireballBot, health: 20 }
    - { kind: kill, who: FireballBot, target: ghast }
    - { kind: completion, who: FireballBot }
