name: hide-close-intruder
description: An authorized close attacker is repelled before low-health shelter construction.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doMobSpawning: false
    naturalRegeneration: true
players:
  - name: CorneredHide
    pos: [0.5, -60, 0.5]
    op: true
    inventory:
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: golden_boots, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_sword, count: 1 }
      - { item: iron_pickaxe, count: 1 }
      - { item: cobblestone, count: 73 }
      - { item: cooked_beef, count: 30 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./hide-close-intruder.ts"]
goal:
  kind: completion
  who: CorneredHide
  timeout: 30
