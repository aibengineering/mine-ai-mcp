name: distant-attacker
description: Survive sustained native blaze fire that begins outside passive observation range.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doMobSpawning: false
    doDaylightCycle: false
players:
  - name: DistantAttacker
    pos: [0.5, -60, 0.5]
    op: true
    inventory:
      - { item: iron_sword, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./distant-attacker.ts"]
goal:
  kind: completion
  who: DistantAttacker
  timeout: 55
