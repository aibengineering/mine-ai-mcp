name: idle-creeper-unarmed-evade
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: creeper
    # Inside the creeper's own sixteen-block follow range so it walks in, and
    # outside the reflex's eight-block contact boundary so the decision is
    # made on arrival rather than at spawn.
    pos: [12.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: CreeperBot
    pos: [0.5, -60, 0.5]
    # Healthy but bare-handed: a sword or a bow would make this a hit-and-run
    # fight. Fists cannot knock a creeper clear of its own fuse.
    inventory:
      - { item: dirt, count: 3 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  waitTicks: 960

tick:
  - "gamemode spectator @a[name=!CreeperBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: health
      who: CreeperBot
      health: 20
    - kind: survive
      who: CreeperBot
      seconds: 1
    - kind: completion
      who: CreeperBot
