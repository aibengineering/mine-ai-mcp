name: navigation-pack-fight
description: "Reach the declared destinations alive through hostile terrain in the production runtime. Combat and avoidance choices are diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

# Abreast, so both are inside the observation window at contact and the bot is
# genuinely outnumbered rather than meeting two hostiles in sequence.
entities:
  - type: zombie
    pos: [24.5, -60, -0.5]
    nbt: "{PersistenceRequired:1b}"
  - type: zombie
    pos: [24.5, -60, 1.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: PackFightBot
    pos: [0.5, -60, 0.5]
    # Armored, and the driver puts it on before setting out. Two zombies hitting
    # at once cost ten to twelve and a half health for one kill unarmored, which
    # straddles the ten-health threshold and would make this fixture a coin
    # flip between clearing the pair and withdrawing after the first.
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./combat-handoff.ts"]

params:
  wearArmor: true
  firstTarget:
    - 40
    - -60
    - 0
  secondTarget:
    - 38
    - -60
    - 0

tick:
  - "gamemode spectator @a[name=!PackFightBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: reach
      who: PackFightBot
      pos:
        - 38.5
        - -60
        - 0.5
      radius: 2
    - kind: survive
      who: PackFightBot
      seconds: 1
    - kind: completion
      who: PackFightBot
