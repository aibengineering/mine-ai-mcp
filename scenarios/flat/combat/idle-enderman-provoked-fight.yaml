name: idle-enderman-provoked-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: enderman
    pos: [5.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: EnderAngryBot
    pos: [0.5, -60, 0.5]
    # Opped so the driver can land the provoking blow from the bot itself.
    op: true
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  provoke: enderman
  waitTicks: 1200

tick:
  - "gamemode spectator @a[name=!EnderAngryBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 120
  goals:
    - kind: survive
      who: EnderAngryBot
      seconds: 1
    - kind: completion
      who: EnderAngryBot
