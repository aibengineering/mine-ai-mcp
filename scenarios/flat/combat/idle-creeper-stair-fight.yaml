name: idle-creeper-stair-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill 1 -60 -5 14 -50 5 air"

setup:
  - "difficulty normal"

# A stone staircase rising away from the creeper, starting directly behind
# the bot. Hit-and-run sprints straight away from the target, and this is the
# ground a bot climbing out of a mine actually has behind it: the live bot
# that took two explosions on a hillside had its retreat end at the first
# step up, still inside the seven blocks a creeper's fuse keeps counting in.
geometry:
  - fill: { block: stone, from: [1, -60, -5], to: [14, -60, 5] }
  - fill: { block: stone, from: [3, -59, -5], to: [14, -59, 5] }
  - fill: { block: stone, from: [5, -58, -5], to: [14, -58, 5] }
  - fill: { block: stone, from: [7, -57, -5], to: [14, -57, 5] }
  - fill: { block: stone, from: [9, -56, -5], to: [14, -56, 5] }

entities:
  - type: creeper
    # From the open side, so the only way clear of it is up the stairs, and
    # already inside the eight-block contact boundary: spawned further out it
    # is met on the flat, because the bot walks out to whatever crosses the
    # boundary and the fight settles wherever the two meet.
    pos: [-4.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: CreeperStairBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 1200

tick:
  - "gamemode spectator @a[name=!CreeperStairBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 120
  goals:
    - kind: entityCount
      entity: creeper
      max: 0
    - kind: health
      who: CreeperStairBot
      health: 15
    - kind: survive
      who: CreeperStairBot
      seconds: 1
    - kind: completion
      who: CreeperStairBot
