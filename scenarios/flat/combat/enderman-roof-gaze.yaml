name: enderman-roof-gaze
description: Defeat a native raised enderman and survive with both existing and buildable protection available.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
geometry:
  - fill: { block: cobblestone, from: [-1, -58, -1], to: [1, -58, 1] }
  - fill: { block: stone, from: [6, -60, -4], to: [12, -60, 4] }
players:
  - name: RoofFighter
    op: true
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }
      - { item: cobblestone, count: 32 }
entities:
  - { type: enderman, pos: [7.5, -59, 0.5], nbt: "{PersistenceRequired:1b}" }
client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/hunter.ts"]
params:
  mob_name: enderman
  drop_name: ender_pearl
  count: 1
  defeat_count: 1
  wear_armor: true
goal:
  kind: all
  timeout: 90
  goals:
    - { kind: kill, who: RoofFighter, target: enderman }
    - { kind: survive, who: RoofFighter, seconds: 1 }
    - { kind: completion, who: RoofFighter }
