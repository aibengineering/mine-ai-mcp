name: busy-dig-interrupted
description: Collect the requested stone and survive a zombie approaching during the job.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill 6 -60 -6 14 -55 6 air"

setup:
  - "difficulty normal"

# A stone face the bot has to walk to and dig into, so the interruption lands
# mid-job with the pickaxe in hand and the pathfinder idle.
geometry:
  - fill: { block: stone, from: [8, -60, -3], to: [11, -57, 3] }

entities:
  - type: zombie
    # Behind the bot, so the dig is what the reflex interrupts, not an approach.
    # Fourteen blocks: at twenty-four the bot had finished twelve stone before
    # the zombie closed the distance it had walked away from it.
    pos: [-14.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: DigBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: stone_pickaxe, count: 1 }
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./busy-collect-reflex.ts"]

params:
  blockName: stone
  # Twenty-eight stone is roughly twenty-five seconds of walking and digging;
  # twelve was over in ten, before the zombie arrived.
  count: 28

tick:
  - "gamemode spectator @a[name=!DigBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 120
  goals:
    - kind: hasItem
      who: DigBot
      item: cobblestone
      count: 28
    - kind: survive
      who: DigBot
      seconds: 1
    - kind: completion
      who: DigBot
