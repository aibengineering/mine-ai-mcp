name: idle-skeleton-bow-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: skeleton
    pos: [7.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'

players:
  - name: SkeletonBowBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 900
  finishAfterTargetDeath: skeleton

tick:
  - "gamemode spectator @a[name=!SkeletonBowBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: kill
      who: SkeletonBowBot
      target: skeleton
    - kind: health
      who: SkeletonBowBot
      health: 20
    - kind: survive
      who: SkeletonBowBot
      seconds: 1
    - kind: completion
      who: SkeletonBowBot
