name: idle-phantom-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  # A flier: minecraft-data types it `mob`, not `hostile`, and no route on the
  # ground reaches it. Both were blind spots before this fixture existed.
  - type: phantom
    pos: [0.5, -46, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: PhantomBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 2400

tick:
  - "gamemode spectator @a[name=!PhantomBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 150
  goals:
    - kind: entityCount
      entity: phantom
      max: 0
    - kind: health
      who: PhantomBot
      health: 10
    - kind: survive
      who: PhantomBot
      seconds: 1
    - kind: completion
      who: PhantomBot
