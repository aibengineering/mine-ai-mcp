name: navigation-creeper-cave-crossfire
description: Cross a low stone passage with side chambers through a native skeleton, zombie and creeper; preserve the journey and at least twelve health.
template: ../../../scenario-templates/arenas/traverse.yaml
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
reset:
  - "kill @e[type=!minecraft:player]"
players:
  - name: CrossfireBot
    pos: [-22.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./navigation-creeper-crossfire.ts"]
params: { destination: [22, -60, 0] }
goal:
  kind: all
  timeout: 150
  goals:
    - { kind: reach, who: CrossfireBot, pos: [22.5, -60, 0.5], radius: 2 }
    - { kind: health, who: CrossfireBot, health: 12 }
    - { kind: completion, who: CrossfireBot }

geometry:
  - fill: { block: stone, from: [-47, -61, -19], to: [47, -57, 19] }
  - fill: { block: air, from: [-46, -60, -3], to: [46, -58, 3] }
  - fill: { block: air, from: [-8, -60, -8], to: [8, -58, 8] }
# The nearby melee attacker starts contact while the creeper approaches from
# farther back. Two native shooters keep the encounter mixed as targets die.
entities:
  - type: skeleton
    pos: [-16.5, -60, -2.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'
  - type: skeleton
    pos: [-12.5, -60, 2.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'
  - type: zombie
    pos: [-16.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b}'
  - type: creeper
    pos: [-12.5, -60, -0.5]
    nbt: '{PersistenceRequired:1b}'
