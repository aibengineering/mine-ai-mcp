name: hurt-bot-evades
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: zombie
    pos: [24.5, -60, -0.5]
    nbt: "{PersistenceRequired:1b}"
  - type: zombie
    pos: [24.5, -60, 1.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: HurtBot
    pos: [0.5, -60, 0.5]
    # Opped so the driver can spend the bot's health itself and then wait for
    # the bar to settle before anything arrives.
    op: true
    # Armed and carrying exactly what the fight path needs. The only fact
    # separating this fixture from idle-pack-fight is the health bar, which is
    # the whole of the policy.
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  hurtTo: 8
  waitTicks: 960

tick:
  - "gamemode spectator @a[name=!HurtBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: survive
      who: HurtBot
      seconds: 1
    - kind: completion
      who: HurtBot
