name: idle-axe-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: zombie
    pos: [24.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: AxeBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: diamond_shovel, count: 1 }
      - { item: wooden_pickaxe, count: 1 }
      - { item: iron_axe, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  waitTicks: 900

tick:
  - "gamemode spectator @a[name=!AxeBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: kill
      who: AxeBot
      target: zombie
    - kind: survive
      who: AxeBot
      seconds: 1
    - kind: completion
      who: AxeBot
