name: shielded-melee-creeper-escape
description: A native creeper interrupts shielded melee; release item slowdown and crouch, then sprint out of fuse range.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules: { doMobSpawning: false, naturalRegeneration: false, doDaylightCycle: false }
reset:
  - "kill @e[type=!minecraft:player]"
entities:
  - type: zombie
    pos: [2.5, -60, 0.5]
    nbt: '{NoAI:1b,Invulnerable:1b,PersistenceRequired:1b}'
players:
  - name: EscapeGuard
    op: true
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./shielded-melee-creeper-escape.ts"]
goal:
  kind: all
  timeout: 45
  goals:
    - { kind: health, who: EscapeGuard, health: 20 }
    - { kind: completion, who: EscapeGuard }
