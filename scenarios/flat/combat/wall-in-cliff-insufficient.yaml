name: wall-in-cliff-insufficient
description: A wall over an adjacent drop can use the completed roof as support, without extending the shelter footprint.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doMobSpawning: false
geometry:
  - fill: { block: air, from: [1, -63, -4], to: [5, -60, 4] }
players:
  - name: WallBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: cobblestone, count: 10 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./wall-in-clearance.ts"]
params:
  expectFailure: true
goal:
  kind: completion
  who: WallBot
  timeout: 35
