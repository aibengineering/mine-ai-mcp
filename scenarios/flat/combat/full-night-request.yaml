name: full-night-request
description: Survive a full native night at seven health with a mob ring while retaining one pending collection request.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules:
    doDaylightCycle: true
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0

geometry:
  - fill: { block: stone, from: [-16, -60, -16], to: [16, -60, 16] }

players:
  - name: NightSurvivor
    pos: [0.5, -59, 0.5]
    # The driver uses /damage to establish low health before the measured window.
    op: true
    inventory:
      - { item: cobblestone, count: 64 }

# All mobs have normal AI. They activate after Mine Labs has prepared the player.
entities:
  - { type: zombie, pos: [8.5, -59, 0.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [6.5, -59, 6.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [0.5, -59, 8.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [-5.5, -59, 6.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [-7.5, -59, 0.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [-5.5, -59, -5.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [0.5, -59, -7.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: zombie, pos: [6.5, -59, -5.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring],IsBaby:0b}" }
  - { type: spider, pos: [3.5, -59, 7.5], nbt: "{PersistenceRequired:1b,NoAI:1b,Tags:[night_ring]}" }

client:
  command: bun
  args: ["../../src/client-host.ts", "./full-night-request.ts"]

params:
  startingHealth: 7

goal:
  kind: all
  timeout: 660
  goals:
    # Server-observed deaths prevent respawning from satisfying this goal.
    - { kind: survive, who: NightSurvivor, seconds: 550 }
    # Confirms the full interval occurred after low-health and threat setup.
    - { kind: completion, who: NightSurvivor }
