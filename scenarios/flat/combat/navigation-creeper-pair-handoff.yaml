name: navigation-creeper-pair-handoff
description: "Reach the declared destinations alive through hostile terrain in the production runtime. Combat and avoidance choices are diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

# The pair the live bot walked into on its way home from a mine, met the same
# way: under navigation rather than idle. Twenty-four blocks out is three
# times the contact boundary, so the route is what the reflex interrupts. The
# bot carries a bow: without one the policy evades a pair, and this fixture is
# about the road home being cleared rather than fled.
entities:
  - type: creeper
    pos: [24.5, -60, -1.5]
    nbt: "{PersistenceRequired:1b}"
  - type: creeper
    pos: [24.5, -60, 2.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: CreeperRouteBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: iron_sword, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./combat-handoff.ts"]

params:
  wearArmor: true
  firstTarget:
    - 40
    - -60
    - 0
  secondTarget:
    - 38
    - -60
    - 0

tick:
  - "gamemode spectator @a[name=!CreeperRouteBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 120
  goals:
    - kind: reach
      who: CreeperRouteBot
      pos:
        - 38.5
        - -60
        - 0.5
      radius: 2
    - kind: survive
      who: CreeperRouteBot
      seconds: 1
    - kind: completion
      who: CreeperRouteBot
