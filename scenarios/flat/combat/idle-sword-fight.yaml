name: idle-sword-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  - type: zombie
    pos: [24.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: SwordBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  waitTicks: 700

tick:
  - "gamemode spectator @a[name=!SwordBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 70
  goals:
    - kind: kill
      who: SwordBot
      target: zombie
    - kind: survive
      who: SwordBot
      seconds: 1
    - kind: completion
      who: SwordBot
