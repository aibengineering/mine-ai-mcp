name: idle-creeper-pair-bow-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

# The pair the sword-only bot evades. Arrows are the one way to thin it before
# it arrives: from sixteen blocks a walking creeper gives a bow three or four
# full draws. Shared tactics handle the fuses if either reaches the bot.
entities:
  - type: creeper
    pos: [14.5, -60, -1.5]
    nbt: "{PersistenceRequired:1b}"
  - type: creeper
    pos: [14.5, -60, 2.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: PairBowBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 32 }
      - { item: iron_sword, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 1800

tick:
  - "gamemode spectator @a[name=!PairBowBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 150
  goals:
    - kind: entityCount
      entity: creeper
      max: 0
    - kind: health
      who: PairBowBot
      health: 15
    - kind: survive
      who: PairBowBot
      seconds: 1
    - kind: completion
      who: PairBowBot
