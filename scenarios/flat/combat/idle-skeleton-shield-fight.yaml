name: idle-skeleton-shield-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

# Skeletons normally hold outside the reflex's eight-block contact boundary.
# Starting inside it isolates the controller's ranged-opponent mechanics rather
# than asking this fixture to silently redefine hostile policy.
entities:
  - type: skeleton
    pos: [7.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'

players:
  - name: ShieldSkelBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: iron_helmet, count: 1 }
      - { item: iron_chestplate, count: 1 }
      - { item: iron_leggings, count: 1 }
      - { item: iron_boots, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  wearArmor: true
  waitTicks: 910

tick:
  - "gamemode spectator @a[name=!ShieldSkelBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 90
  goals:
    - kind: kill
      who: ShieldSkelBot
      target: skeleton
    - kind: health
      who: ShieldSkelBot
      health: 10
    - kind: survive
      who: ShieldSkelBot
      seconds: 1
    - kind: completion
      who: ShieldSkelBot
