name: idle-bow-fight
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

# Melee zombies now trigger defense only in melee reach, where the sword is
# correct. A ranged attacker preserves this fixture's bow-selection contract.
entities:
  - type: skeleton
    # Within native skeleton acquisition range, outside melee loadout range.
    pos: [12.5, -60, 0.5]
    nbt: '{PersistenceRequired:1b,HandItems:[{id:"minecraft:bow",count:1},{}]}'

players:
  - name: BowBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: bow, count: 1 }
      - { item: arrow, count: 16 }
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  waitTicks: 700

tick:
  - "gamemode spectator @a[name=!BowBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 70
  goals:
    - kind: kill
      who: BowBot
      target: skeleton
    - kind: survive
      who: BowBot
      seconds: 1
    - kind: completion
      who: BowBot
