name: magma-cube-confined-bystander
description: Use a carried non-sweeping tool to repel native magma cubes beside a neutral enderman while escaping the confined basalt passage.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
setup:
  - "difficulty normal"
geometry:
  - fill: { block: bedrock, from: [-7, -62, -2], to: [60, -61, 2] }
  - fill: { block: basalt, from: [-6, -60, -1], to: [60, -60, 1] }
  - fill: { block: bedrock, from: [-7, -60, -2], to: [10, -54, -2] }
  - fill: { block: bedrock, from: [-7, -60, 2], to: [10, -54, 2] }
  - fill: { block: bedrock, from: [-7, -60, -2], to: [-7, -54, 2] }
  - fill: { block: air, from: [1, -60, -1], to: [2, -60, 1] }
entities:
  - type: magma_cube
    pos: [-4.5, -59, 0.5]
    nbt: "{Size:3,NoAI:1b,PersistenceRequired:1b}"
  - type: magma_cube
    pos: [3.5, -59, 0.5]
    nbt: "{Size:1,NoAI:1b,PersistenceRequired:1b}"
  - type: enderman
    pos: [1.5, -59, 1.3]
    nbt: "{NoAI:1b,PersistenceRequired:1b}"
players:
  - name: CubeEvader
    op: true
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: diamond_helmet, count: 1 }
      - { item: diamond_chestplate, count: 1 }
      - { item: diamond_leggings, count: 1 }
      - { item: diamond_boots, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./magma-cube-confined.ts"]
goal:
  kind: completion
  who: CubeEvader
  timeout: 30
