name: blaze-shield-existing-cover
description: Defeat both native blazes and leave the existing firing passage alive.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: true, keepInventory: false }
# The passage and equipment are available strategies. Both kills, survival and
# reaching the exit are the proof.
params: { witness: guarded_kills }
geometry:
  - fill: { block: stone, from: [-1, -60, -1], to: [2, -58, 0] }
  - fill: { block: air, from: [0, -60, 0], to: [1, -59, 0] }
  - fill: { block: stone, from: [0, -60, 1], to: [0, -59, 1] }
entities:
  - { type: blaze, pos: [1.5, -60, 10.5], nbt: "{PersistenceRequired:1b}" }
  - { type: blaze, pos: [5.5, -60, 10.5], nbt: "{PersistenceRequired:1b}" }
players:
  - name: CoverBlaze
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: diamond_helmet, count: 1 }
      - { item: diamond_chestplate, count: 1 }
      - { item: diamond_leggings, count: 1 }
      - { item: diamond_boots, count: 1 }
      - { item: bow, count: 1 }
      - { item: arrow, count: 64 }
      - { item: shield, count: 1 }
      - { item: cooked_beef, count: 16 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./existing-cover.ts"]
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: kill, who: CoverBlaze, target: blaze }
    - { kind: completion, who: CoverBlaze }
