name: idle-enderman-ignored
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"

setup:
  - "difficulty normal"

entities:
  # Well inside the eight-block contact boundary. Any other hostile here would
  # be fought within a tick; an enderman that has not been provoked is not a
  # threat, and treating it as one cost a mining trip its iron.
  - type: enderman
    pos: [5.5, -60, 0.5]
    nbt: "{PersistenceRequired:1b}"

players:
  - name: EnderCalmBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: iron_sword, count: 1 }
      - { item: shield, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-reflex.ts"]

params:
  waitTicks: 300

tick:
  - "gamemode spectator @a[name=!EnderCalmBot,gamemode=!spectator]"

goal:
  kind: all
  timeout: 60
  goals:
    - kind: entityCount
      entity: enderman
      min: 1
    - kind: health
      who: EnderCalmBot
      health: 20
    - kind: survive
      who: EnderCalmBot
      seconds: 1
    - kind: completion
      who: EnderCalmBot
