name: idle-zombie-step-approach
description: "Meet the declared survival, health and native entity goals with
  the available equipment. Weapon choices and survival response sequences are
  diagnostic evidence."
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0
reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -6 -60 -4 9 -52 4 air"
setup:
  - "difficulty normal"
geometry:
  - fill: { block: stone, from: [4, -60, -2], to: [8, -60, 2] }
entities:
  - type: zombie
    pos: [5.5, -59, 0.5]
    nbt: "{PersistenceRequired:1b}"
players:
  - name: StepFightBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: stone_sword, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./idle-zombie-step-approach.ts"]
params:
  waitTicks: 400

tick:
  - "gamemode spectator @a[name=!StepFightBot,gamemode=!spectator]"
goal:
  kind: all
  timeout: 35
  goals:
    - kind: kill
      who: StepFightBot
      target: zombie
    - kind: health
      who: StepFightBot
      health: 12
    - kind: completion
      who: StepFightBot
