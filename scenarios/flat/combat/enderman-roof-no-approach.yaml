name: enderman-roof-no-approach
description: Defeat one native enderman from a start beneath an existing roof and survive the declared terrain and
  supply constraints. This finite-mob test does not qualify ender_pearl
  acquisition or prescribe a tactic.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: midnight
  difficulty: normal
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
geometry:
  - fill: { block: cobblestone, from: [-1, -58, -1], to: [1, -58, 1] }
players:
  - name: PatientRoofBot
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: diamond_sword, count: 1 }
      - { item: shield, count: 1 }
      - { item: cobblestone, count: 64 }
entities:
  - { type: enderman, pos: [6.5, -60, 0.5], nbt: "{PersistenceRequired:1b}" }
client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/hunter.ts"]
goal:
  kind: all
  timeout: 90
  goals:
    - kind: kill
      who: PatientRoofBot
      target: enderman
    - kind: survive
      who: PatientRoofBot
      seconds: 1
    - kind: completion
      who: PatientRoofBot
params:
  mob_name: enderman
  drop_name: ender_pearl
  count: 1
  defeat_count: 1
