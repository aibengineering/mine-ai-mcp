name: end-entry-near
description: Enter the End after native sleep confirms a nearby personal respawn bed.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: 13000
  gamerules: { doDaylightCycle: true, doMobSpawning: false, keepInventory: true }
reset: ["fill -40 -59 -16 16 -45 16 air"]
geometry:
  - fill: { block: stone_bricks, from: [-40, -60, -16], to: [16, -60, 16] }
  - fill: { block: end_portal, from: [-1, -59, -1], to: [1, -59, 1] }
  - fill: { block: "end_portal_frame[facing=south,eye=true]", from: [-1, -59, -2], to: [1, -59, -2] }
  - fill: { block: "end_portal_frame[facing=north,eye=true]", from: [-1, -59, 2], to: [1, -59, 2] }
  - fill: { block: "end_portal_frame[facing=east,eye=true]", from: [-2, -59, -1], to: [-2, -59, 1] }
  - fill: { block: "end_portal_frame[facing=west,eye=true]", from: [2, -59, -1], to: [2, -59, 1] }
  - setblock: { block: "red_bed[facing=east,part=foot,occupied=false]", at: [-7, -59, 0] }
  - setblock: { block: "red_bed[facing=east,part=head,occupied=false]", at: [-6, -59, 0] }
players:
  - name: NearRespawn
    pos: [-8.5, -59, 0.5]
    inventory: [{ item: cooked_beef, count: 16 }, { item: arrow, count: 32 }]
client: { command: bun, args: ["../../src/client-host.ts", "./end-entry-guard.ts"] }
params: { mode: near }
goal: { kind: completion, who: NearRespawn, timeout: 120 }
