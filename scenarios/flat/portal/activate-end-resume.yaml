name: activate-end-resume
description: Fill an End portal, cancel after three insertions, and resume without spending eyes twice or entering the End.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0
reset:
  - "fill -16 -59 -16 16 -45 16 air"
geometry:
  - fill: { block: stone_bricks, from: [-16, -60, -16], to: [16, -60, 16] }
  - fill: { block: "end_portal_frame[facing=south,eye=false]", from: [-1, -59, -2], to: [1, -59, -2] }
  - fill: { block: "end_portal_frame[facing=north,eye=false]", from: [-1, -59, 2], to: [1, -59, 2] }
  - fill: { block: "end_portal_frame[facing=east,eye=false]", from: [-2, -59, -1], to: [-2, -59, 1] }
  - fill: { block: "end_portal_frame[facing=west,eye=false]", from: [2, -59, -1], to: [2, -59, 1] }
  - fill: { block: "end_portal_frame[facing=south,eye=true]", from: [-1, -59, -2], to: [0, -59, -2] }
players:
  - name: PortalFiller
    # Starting in the opening proves the action moves out before activation.
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: ender_eye, count: 10 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./activate-end-resume.ts"]
goal:
  kind: completion
  who: PortalFiller
  timeout: 180
