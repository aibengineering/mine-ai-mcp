name: frontier-biome-jump
description: Enter the target during a gap crossing and settle on the landing before exploration releases movement.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doMobSpawning: false
    doDaylightCycle: false
    naturalRegeneration: false
reset:
  - "fill -3 -63 -3 20 -53 3 air"
geometry:
  - fill: { block: netherrack, from: [-3, -59, 0], to: [0, -59, 0] }
  - fill: { block: netherrack, from: [4, -59, 0], to: [20, -59, 0] }
setup:
  - "fillbiome 4 -60 -4 23 -53 3 warped_forest"
players:
  - name: Explorer
    pos: [0.5, -58, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/explorer.ts"]
params:
  heading: 90
  chunks: 1
  biome: warped_forest
  expect_airborne_entry: true
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: reach, who: Explorer, pos: [4.5, -58, 0.5], radius: 0.8 }
    - { kind: health, who: Explorer, health: 20 }
    - { kind: completion, who: Explorer }
