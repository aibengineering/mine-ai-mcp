name: cramped-chest
description: Refuse a blocked chest, clear its lid with nearly full inventory, and place a usable chest nearby.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    randomTickSpeed: 0
reset:
  - "fill -6 -60 -6 6 -50 6 air"
geometry:
  - fill: { block: stone, from: [-5, -60, -5], to: [5, -60, 5] }
  - fill: { block: deepslate, from: [-5, -57, -5], to: [5, -57, 5] }
  - setblock: { block: chest, at: [1, -59, 0] }
  - setblock: { block: deepslate, at: [1, -58, 0] }
players:
  - name: CrampedBot
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: cobblestone, count: 1984 }
      - { item: iron_pickaxe, count: 1 }
      - { item: chest, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./cramped-chest.ts"]
goal:
  kind: all
  timeout: 90
  goals:
    - { kind: hasItem, who: CrampedBot, item: cobbled_deepslate, count: 1 }
    - { kind: completion, who: CrampedBot }
