name: momentum-step-up-corner
description: Carry sprint momentum into a step-up, then turn on a one-block shelf over lava without stopping or overshooting.

# This fixture protects the movement boundary which failed when continuity was
# first attempted: a moving bot reached a step-up with controls and velocity
# inherited from the previous movement, continued past the intended support,
# and fell into lava. A safe implementation has to preserve forward progress
# while letting the new controller immediately own the heading and inputs.
#
# The client adds the continuity discriminator which an external reach goal
# cannot observe: while the bot occupies the final runway cell, its horizontal
# speed must never fall to the settled-arrival gate. The Mine Labs health goal
# independently proves that keeping that speed did not throw the bot off the
# narrow corner.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -9 -64 -6 12 -46 12 air"

geometry:
  # Sealed lava basin. The course is one block wide wherever momentum matters,
  # so a missed correction becomes health loss instead of a forgiving replan.
  - fill: { block: bedrock, from: [-7, -63, -4], to: [9, -63, 9] }
  - fill: { block: bedrock, from: [-7, -62, -4], to: [-7, -48, 9] }
  - fill: { block: bedrock, from: [9, -62, -4], to: [9, -48, 9] }
  - fill: { block: bedrock, from: [-7, -62, -4], to: [9, -48, -4] }
  - fill: { block: bedrock, from: [-7, -62, 9], to: [9, -48, 9] }
  - fill: { block: lava, from: [-6, -62, -3], to: [8, -62, 8] }

  # Six supported cells provide an unambiguous eastbound sprint approach.
  - fill: { block: blue_concrete, from: [-5, -60, 0], to: [0, -60, 0] }

  # The rise is one block east. There is no support at x=2, so retaining the
  # old eastbound controls after arrival sends the bot into lava.
  - setblock: { block: gold_block, at: [1, -59, 0] }

  # Turn north immediately, remaining on a one-block-wide elevated shelf.
  - fill: { block: emerald_block, from: [1, -59, 1], to: [1, -59, 5] }

  # Block the diagonal step-up from the runway straight to the north shelf.
  # The route must enter the gold corner first and expose the exact handoff.
  - fill: { block: bedrock, from: [0, -59, 1], to: [0, -58, 1] }

players:
  - name: MomentumBot
    pos: [-4.5, -59, 0.5]

client:
  command: bun
  args: ["../../src/client-host.ts", "./momentum-step-up-corner.ts"]

tick:
  - "gamemode spectator @a[name=!MomentumBot,gamemode=!spectator]"

params:
  target: [1, -58, 4]
  range: 0.5

goal:
  kind: all
  timeout: 60
  goals:
    - kind: reach
      who: MomentumBot
      pos: [1.5, -58, 4.5]
      radius: 0.75
    - kind: health
      who: MomentumBot
      health: 20
    - kind: completion
      who: MomentumBot
