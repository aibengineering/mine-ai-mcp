name: vine-knockback-mid-climb
description: Stay in a north-backed vine column after a sideways velocity packet during ascent and finish the climb unhurt.

# The 2026-09-13 retained failure began with inherited sprint velocity. This
# companion case applies a larger packet after the body is already established
# in the column, proving the controller responds to current motion every tick.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
reset:
  - "fill -5 -61 -4 8 -48 4 air"
geometry:
  - fill: { block: andesite, from: [-5, -61, -4], to: [8, -61, 4] }
  - fill: { block: stone, from: [1, -60, -1], to: [3, -50, -1] }
  - setblock: { block: "vine[north=true]", at: [2, -60, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -59, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -58, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -57, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -56, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -55, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -54, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -53, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -52, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -51, 0] }
  - setblock: { block: "vine[north=true]", at: [2, -50, 0] }
players:
  - name: VineImpulseBot
    pos: [5.5, -60, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./vine-knockback-mid-climb.ts"]
params:
  legs:
    - { target: [2, -49, -1], range: 1, label: "climb after the sideways impulse" }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: reach, who: VineImpulseBot, pos: [2.5, -49, -0.5], radius: 1.5 }
    - { kind: health, who: VineImpulseBot, health: 20 }
    - { kind: completion, who: VineImpulseBot }
