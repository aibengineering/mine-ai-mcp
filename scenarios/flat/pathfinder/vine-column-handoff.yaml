name: vine-column-handoff
description: Leave the vine column that ends mid-descent and enter the one that picks up a block over, without abandoning the step that carries the body across.

# The geometry of incident 97c795ac, which vine-ledge-entry keeps only the
# entry of: at -6,102,29 the column the bot was riding stopped and the next one
# stood a block away at x=-5, z=28.
#
# Found while building that fixture. The route plans a lateral step onto the
# cell above the next column's top vine and expects to stand there. Nothing
# stands there: the cell is air, the vine under it has no collision, and the
# body enters the column and rides it to the foot. The step is holding out for
# a settled arrival that a hanging body never reports, so it burns its deadline
# while the body slides eight blocks past the cell it was aimed at, and every
# climb the route had planned below is stale by the time it replans.
#
# The body is safe throughout — a slide takes no fall damage — so health and
# arrival both pass either way. The driver rejects failed steps instead.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "fill -12 -61 -12 14 -36 12 air"

geometry:
  - fill: { block: andesite, from: [-12, -61, -12], to: [14, -61, 12] }

  # The ledge, walked at y=-45, ending at x=1 with a run-up along it.
  - fill: { block: stone, from: [-8, -46, -2], to: [1, -46, 2] }

  # The upper column, ending at y=-52. Each vine is held by the wall north of
  # it rather than by the vine above it, so the column survives being written.
  - fill: { block: stone, from: [2, -52, -1], to: [2, -37, -1] }
  - fill: { block: "vine[north=true]", from: [2, -52, 0], to: [2, -45, 0] }

  # The lower column, picking up a block east at y=-53 and running to the floor.
  - fill: { block: stone, from: [3, -60, -1], to: [3, -53, -1] }
  - fill: { block: "vine[north=true]", from: [3, -60, 0], to: [3, -53, 0] }

players:
  - name: ColumnHandoffBot
    pos: [-7.5, -45, 0.5]

client:
  command: bun
  args: ["../../src/client-host.ts", "./vine-column-handoff.ts"]

tick:
  - "gamemode spectator @a[name=!ColumnHandoffBot,gamemode=!spectator]"

params:
  legs:
    - { target: [7, -60, 0], range: 1, label: "ride the upper column down and hand off to the lower one" }

goal:
  kind: all
  timeout: 120
  goals:
    - kind: reach
      who: ColumnHandoffBot
      pos: [7.5, -60, 0.5]
      radius: 1.5
    - kind: health
      who: ColumnHandoffBot
      health: 20
    - kind: completion
      who: ColumnHandoffBot
