name: water-deep-corner
description: Keep air while traversing and turning through a two-deep water passage, then exit onto a ledge.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
reset:
  - "fill -2 -60 -2 10 -40 10 air"
geometry:
  - fill: { block: stone, from: [0, -61, -1], to: [9, -58, 9] }
  - fill: { block: air, from: [1, -60, 0], to: [8, -58, 0] }
  - fill: { block: air, from: [8, -60, 0], to: [8, -58, 8] }
  - fill: { block: water, from: [1, -60, 0], to: [8, -59, 0] }
  - fill: { block: water, from: [8, -60, 0], to: [8, -59, 7] }
  - fill: { block: stone, from: [8, -60, 8], to: [8, -60, 8] }
players:
  - name: Collector
    pos: [1.5, -60, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-traversal.ts"]
params:
  legs:
    - { target: [8, -59, 7], range: 0.1, label: corner }
    - { target: [1, -59, 0], range: 0.1, label: return }
    - { target: [8, -59, 8], range: 0.1, label: exit }
goal:
  kind: all
  timeout: 120
  goals:
    - { kind: survive, who: Collector, seconds: 1 }
    - { kind: health, who: Collector, health: 20 }
    - { kind: completion, who: Collector }
