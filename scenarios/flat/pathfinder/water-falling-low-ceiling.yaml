# Reduced from EnderSeeker's failed westward swim at -862,-54,-472.
# The falling column has room to rise, but its exit has a two-block ceiling.
name: water-falling-low-ceiling
description: Swim out of a falling column beneath a low ceiling without lifting the head into its edge.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
reset:
  - "fill -4 -61 -3 4 -40 3 air"
geometry:
  - fill: { block: stone, from: [-3, -62, -2], to: [3, -56, 2] }
  - fill: { block: air, from: [-2, -59, 0], to: [0, -58, 0] }
  - fill: { block: air, from: [0, -57, 0], to: [1, -57, 0] }
  - setblock: { block: water, at: [1, -58, 0] }
players:
  - name: Collector
    pos: [0.3, -58.4, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-falling-low-ceiling.ts"]
params:
  legs:
    - { target: [-2, -59, 0], range: 0.1, label: low-ceiling-exit }
goal:
  kind: all
  timeout: 45
  goals:
    - { kind: survive, who: Collector, seconds: 0.05 }
    - { kind: health, who: Collector, health: 20 }
    - { kind: reach, who: Collector, pos: [-1.5, -59, 0.5], radius: 0.4 }
    - { kind: completion, who: Collector }
