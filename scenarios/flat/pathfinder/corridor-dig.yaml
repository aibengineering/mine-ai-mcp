name: corridor-dig
description: The same corridor and zombie, with the detour's only entrance
  plugged by a single dirt block; the route pays the break rather than walk past
  the zombie.

minecraft:
  version: "1.21.4"

world:
  type: flat
  # Midnight so nothing burns, and no daylight cycle so the fixture reads the
  # same however long a trial takes.
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -34 -61 -26 34 -50 8 air"

setup:
  - "difficulty normal"

geometry:
  # Ground the whole working area.
  - fill: { block: smooth_stone, from: [-34, -61, -26], to: [34, -61, 8] }

  # One wall sixty-one blocks wide and three high. The width is load-bearing: at
  # thirty-six the route walked round the west end rather than through either
  # lane, because diagonals make lateral travel cheap. Thirty blocks of wall
  # either side of the corridor puts going round well beyond both lanes.
  - fill: { block: smooth_stone, from: [-30, -60, -14], to: [30, -58, -2] }

  # The corridor: the short way, straight at the target, with the zombie in it.
  # Two blocks high, so the wall's top layer roofs it and neither lane can be
  # entered by climbing on to something and dropping in from above.
  - fill: { block: air, from: [0, -60, -14], to: [0, -59, -2] }

  # The detour: nine blocks east, which is one block beyond a zombie's reach,
  # so every cell of it is free.
  - fill: { block: air, from: [9, -60, -14], to: [9, -59, -2] }

  # One block in the detour's mouth, at foot height under the tunnel roof.
  # Both corners beside it are wall, so no diagonal slips past, and the roof
  # means it cannot be stepped over: entering the detour costs exactly one
  # break. Set at the doorway outside the tunnel it was simply climbed, which
  # is what the first run of this fixture recorded.
  - setblock: { block: dirt, at: [9, -60, -2] }

entities:
  # Halfway along the corridor. NoAI so it never moves or swings: what is being
  # measured is the route, and a mob that walks at the bot measures a fight.
  - type: zombie
    pos: [0.5, -60, -8.0]
    nbt: "{NoAI:1b,PersistenceRequired:1b,Silent:1b}"

players:
  - name: Navigator
    pos: [0.5, -60, 0.5]

client:
  command: bun
  args: ["../../src/client-host.ts", "./hostile-corridor.ts"]

tick:
  - "gamemode spectator @a[name=!Navigator,gamemode=!spectator]"

params:
  target: [0, -60, -20]
  # Land on the destination cell itself, so the reach goal below has the whole
  # of its radius as slack rather than sharing it with the arrival tolerance.
  range: 0.5
  corridorX: 0
  detourX: 9
  laneZ: [-14, -2]

goal:
  kind: all
  timeout: 90
  goals:
    - kind: reach
      who: Navigator
      pos: [0.5, -60, -19.5]
      radius: 1.5

    # Never touched: a route that goes round does not fight, and the zombie is
    # still standing where the fixture put it.
    - kind: health
      who: Navigator
      health: 20

    - kind: entityCount
      entity: zombie
      min: 1

    # The one block it was worth breaking is gone.
    - kind: blockAt
      who: Navigator
      pos: [9, -60, -2]
      block: air

    # And the wall it was not worth breaking is not.
    - kind: blockAt
      who: Navigator
      pos: [5, -60, -8]
      block: smooth_stone

    - kind: completion
      who: Navigator
