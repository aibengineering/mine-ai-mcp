name: brute-pack-corridor-detour
description: The brute corridor with three brutes stacked in it instead of one,
  so the near lane's summed cost clears the old flat cap; the route still takes
  the far lane and never enters acquisition range.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: midnight
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    naturalRegeneration: false
    randomTickSpeed: 0

reset:
  - "kill @e[type=!minecraft:player]"
  - "fill -54 -61 -40 54 -57 -5 air"
  - "fill -54 -61 -4 54 -57 30 air"

setup:
  - "difficulty normal"

# Geometry identical to brute-corridor-detour, so the only variable between the
# two fixtures is how many brutes are standing in the corridor.
geometry:
  - fill: { block: smooth_stone, from: [-54, -61, -40], to: [54, -61, 30] }
  - fill: { block: smooth_stone, from: [-48, -60, -14], to: [48, -58, -2] }
  - fill: { block: air, from: [0, -60, -14], to: [0, -59, -2] }
  - fill: { block: air, from: [13, -60, -14], to: [13, -59, -2] }
  - fill: { block: air, from: [25, -60, -14], to: [25, -59, -2] }

entities:
  # Three in adjacent cells rather than spread down the corridor, so the pack
  # is one cluster and the lanes are measured against all of it at once, and so
  # the start and the target both stay outside the priced band.
  #
  # This is what the fixture is for. At the near lane each of the three is
  # about thirteen blocks off and worth some twenty-three ticks, so the cell
  # sums to near seventy - above the fifty a flat cap allowed. Under that cap
  # three brutes priced the lane exactly as one did, and the route could not
  # tell a bastion from a straggler. The cap now rises with the count, so the
  # sum survives and the near lane costs what three fights are worth.
  - type: piglin_brute
    pos: [0.5, -60, -7.0]
    nbt: "{NoAI:1b,PersistenceRequired:1b,Silent:1b}"
  - type: piglin_brute
    pos: [0.5, -60, -8.0]
    nbt: "{NoAI:1b,PersistenceRequired:1b,Silent:1b}"
  - type: piglin_brute
    pos: [0.5, -60, -9.0]
    nbt: "{NoAI:1b,PersistenceRequired:1b,Silent:1b}"

players:
  - name: Navigator
    pos: [0.5, -60, 18.5]

client:
  command: bun
  args: ["../../src/client-host.ts", "./brute-corridor.ts"]

tick:
  - "gamemode spectator @a[name=!Navigator,gamemode=!spectator]"

params:
  target: [0, -60, -34]
  range: 0.5
  species: piglin_brute
  acquisitionRange: 16
  lanes:
    - ["corridor", 0]
    - ["near", 13]
    - ["far", 25]
  laneZ: [-14, -2]

goal:
  kind: all
  timeout: 150
  goals:
    - kind: reach
      who: Navigator
      pos: [0.5, -60, -33.5]
      radius: 1.5

    - kind: health
      who: Navigator
      health: 20

    # All three still standing where the fixture put them.
    - kind: entityCount
      entity: piglin_brute
      min: 3

    # A wider priced band and a higher cap are both pressure to dig rather than
    # walk. Neither wall may be opened.
    - kind: blockAt
      who: Navigator
      pos: [6, -60, -8]
      block: smooth_stone
    - kind: blockAt
      who: Navigator
      pos: [19, -60, -8]
      block: smooth_stone

    - kind: completion
      who: Navigator
