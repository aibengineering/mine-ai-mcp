name: dig-route-pickaxe-breaks
description: A dig route stops safely when its nearly-broken diamond pickaxe is lost, then a new request completes with the stone pickaxe left in inventory.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  difficulty: peaceful
  gamerules: { doMobSpawning: false, doDaylightCycle: false }
reset:
  - "fill -3 -62 -3 16 -55 3 stone"
  - "fill -2 -60 -1 2 -59 1 air"
  - "fill 11 -60 -1 14 -59 1 air"
players:
  - name: ToolLossNav
    pos: [0.5, -60, 0.5]
    op: true
client:
  command: bun
  args: ["../../src/client-host.ts", "./dig-route-pickaxe-breaks.ts"]
goal: { kind: completion, who: ToolLossNav, timeout: 90 }
