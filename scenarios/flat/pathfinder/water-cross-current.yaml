name: water-cross-current
description: Cross a shallow sideways current in both directions without drifting out of the planned corridor.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
reset:
  - "fill -3 -59 -5 9 -40 5 air"
geometry:
  - fill: { block: stone, from: [-1, -60, -3], to: [7, -60, 3] }
  - fill: { block: stone, from: [-1, -59, -3], to: [7, -58, -3] }
  - fill: { block: stone, from: [-1, -59, 3], to: [7, -58, 3] }
  - fill: { block: stone, from: [-1, -59, -2], to: [-1, -58, 2] }
  - fill: { block: stone, from: [7, -59, -2], to: [7, -58, 2] }
  - fill: { block: water, from: [3, -59, -2], to: [3, -59, -2] }
players:
  - name: Collector
    pos: [0.5, -59, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-traversal.ts"]
params:
  legs:
    - { target: [6, -59, 0], range: 0.1, label: cross-current }
    - { target: [0, -59, 0], range: 0.1, label: return }
goal:
  kind: all
  timeout: 90
  goals:
    - { kind: survive, who: Collector, seconds: 1 }
    - { kind: health, who: Collector, health: 20 }
    - { kind: completion, who: Collector }
