name: item-pickup-ledge
description: A fresh drop rolls behind a one-block ledge after initially entering pickup reach; collect it through terrain-aware navigation.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    randomTickSpeed: 0
reset:
  - "fill -5 -60 -5 5 -53 6 air"
geometry:
  - fill: { block: stone, from: [-5, -60, -5], to: [5, -60, 6] }
  - fill: { block: grass_block, from: [-5, -59, -5], to: [5, -59, 1] }
players:
  - name: PickupLedgeBot
    pos: [0.8166, -59, 2.3]
    op: true
client:
  command: bun
  args: ["../../src/client-host.ts", "./item-pickup-ledge.ts"]
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: hasItem, who: PickupLedgeBot, item: diamond, count: 1 }
    - { kind: health, who: PickupLedgeBot, health: 20 }
    - { kind: completion, who: PickupLedgeBot }
