name: shallow-water-surface
description: Rise from a two-deep flowing pickup hole while holding its column against the current.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
reset:
  - "fill -5 -57 -5 6 -40 5 air"
geometry:
  - fill: { block: stone, from: [0, -61, -1], to: [3, -58, 1] }
  - fill: { block: air, from: [1, -60, 0], to: [2, -58, 0] }
  - fill: { block: stone, from: [2, -60, 0], to: [2, -60, 0] }
  - fill: { block: water, from: [2, -59, 0], to: [2, -59, 0] }
players:
  - name: Collector
    pos: [1.5, -60, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-traversal.ts"]
params:
  target: [1, -59, 0]
  range: 0.1
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: survive, who: Collector, seconds: 0.05 }
    - { kind: completion, who: Collector }

