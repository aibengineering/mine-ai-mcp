name: storage-detour
description: Navigation takes a longer detour instead of destroying a stocked chest or crafting table.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doMobSpawning: false
geometry:
  - fill: { block: bedrock, from: [-3, -61, -23], to: [9, -61, 18] }
  - fill: { block: bedrock, from: [-3, -58, -23], to: [9, -58, 18] }
  - fill: { block: bedrock, from: [1, -60, -20], to: [5, -59, 15] }
  - fill: { block: air, from: [1, -60, 0], to: [5, -59, 0] }
  - setblock:
      {
        block: 'chest{Items:[{Slot:0b,id:"minecraft:ender_pearl",count:12},{Slot:1b,id:"minecraft:gold_ingot",count:64},{Slot:2b,id:"minecraft:gold_ingot",count:15}]}',
        at: [2, -60, 0],
      }
  - setblock: { block: crafting_table, at: [4, -60, 0] }
players:
  - name: StorageRoute
    pos: [0.5, -60, 0.5]
    inventory:
      - { item: diamond_axe, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./storage-detour.ts"]
goal:
  kind: all
  timeout: 70
  goals:
    - { kind: blockAt, who: StorageRoute, pos: [2, -60, 0], block: chest }
    - { kind: blockAt, who: StorageRoute, pos: [4, -60, 0], block: crafting_table }
    - { kind: completion, who: StorageRoute }
