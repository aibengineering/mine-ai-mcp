name: soul-sand-lava-hop
description: Cross one lava cell from a soul-sand lip without rejecting its fractional support height or touching lava.
# Translated from EnderSeeker's 2026-09-08 death at (-647,32,1).
# Soul sand's top is 1/8 below the navigation node, beside a lava source.
minecraft: { version: "1.21.4" }
world:
  type: flat
  difficulty: normal
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
geometry:
  - fill: { block: air, from: [-6, -63, -6], to: [8, -54, 6] }
  - fill: { block: netherrack, from: [-6, -63, -6], to: [8, -62, 6] }
  - fill: { block: lava, from: [-6, -61, -6], to: [8, -61, 6] }
  - fill: { block: soul_sand, from: [-3, -61, -2], to: [0, -61, 2] }
  - fill: { block: soul_sand, from: [2, -61, -2], to: [5, -61, 2] }
players:
  - name: SoulJumper
    pos: [-0.5, -60, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./soul-sand-lava-hop.ts"]
goal: { kind: completion, who: SoulJumper, timeout: 30 }
