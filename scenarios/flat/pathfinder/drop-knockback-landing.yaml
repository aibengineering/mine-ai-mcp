name: drop-knockback-landing
description: Correct an external sideways impulse after releasing the approach of a two-block drop above lava.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, randomTickSpeed: 0 }
geometry:
  - fill: { block: lava, from: [-4, -60, -4], to: [4, -60, 4] }
  - fill: { block: nether_bricks, from: [0, -59, 0], to: [0, -55, 0] }
  - fill: { block: nether_bricks, from: [0, -59, -1], to: [0, -57, -1] }
players:
  - name: DropImpulseBot
    pos: [0.5, -54, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./drop-knockback-landing.ts"]
goal: { kind: completion, who: DropImpulseBot, timeout: 30 }
