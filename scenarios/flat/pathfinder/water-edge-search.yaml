# EnderSeeker at -912.7,-53.94,-605.245472: feet/head cells are air,
# but the south edge of its body overlaps level-7 water at -913,-54,-605.
# Shifted by [913,-5,606]; the feeding fall is seven cells to the east.
name: water-edge-search
description: Begin a distant route while the body overlaps flowing water beside an air feet cell.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules: { doDaylightCycle: false, doMobSpawning: false, naturalRegeneration: false }
reset:
  - "fill -6 -61 -3 10 -40 4 air"
geometry:
  - fill: { block: deepslate, from: [-5, -62, -2], to: [9, -56, 3] }
  - fill: { block: air, from: [-4, -59, 0], to: [0, -58, 0] }
  - fill: { block: air, from: [0, -59, 1], to: [7, -58, 1] }
  - fill: { block: "water[level=8]", from: [0, -60, 1], to: [3, -60, 1] }
  - setblock: { block: cobblestone, at: [0, -60, 0] }
  - setblock: { block: water, at: [7, -57, 1] }
  - setblock: { block: "water[level=8]", at: [7, -58, 1] }
  - setblock: { block: "water[level=8]", at: [7, -59, 1] }
  - setblock: { block: "water[level=1]", at: [6, -59, 1] }
  - setblock: { block: "water[level=2]", at: [5, -59, 1] }
  - setblock: { block: "water[level=3]", at: [4, -59, 1] }
  - setblock: { block: "water[level=4]", at: [3, -59, 1] }
  - setblock: { block: "water[level=5]", at: [2, -59, 1] }
  - setblock: { block: "water[level=6]", at: [1, -59, 1] }
  - setblock: { block: "water[level=7]", at: [0, -59, 1] }
players:
  - name: Collector
    pos: [0.3, -58.94, 0.7545275915618]
    inventory:
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 54 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-edge-search.ts"]
goal:
  kind: all
  # The live failure never began a step. Allow a search plus its first dig/move.
  timeout: 30
  goals:
    - { kind: survive, who: Collector, seconds: 0.05 }
    - { kind: health, who: Collector, health: 20 }
    - { kind: completion, who: Collector }
