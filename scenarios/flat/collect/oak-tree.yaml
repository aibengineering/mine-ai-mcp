name: oak-tree
description: Fell two standing oaks entirely, taking every trunk log from ground to canopy.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: grass_block, from: [-12, -60, -12], to: [14, -60, 12] }
  # Two oaks, far enough apart that their canopies never touch, so the second
  # is a fresh approach rather than a continuation of the first.
  - fill: { block: oak_leaves, from: [4, -54, -2], to: [8, -52, 2] }
  - fill: { block: oak_leaves, from: [5, -51, -1], to: [7, -51, 1] }
  - fill: { block: oak_log, from: [6, -59, 0], to: [6, -53, 0] }
  - fill: { block: oak_leaves, from: [4, -54, 6], to: [8, -52, 10] }
  - fill: { block: oak_leaves, from: [5, -51, 7], to: [7, -51, 9] }
  - fill: { block: oak_log, from: [6, -59, 8], to: [6, -53, 8] }

players:
  - name: Collector
    pos: [0, -59, 0]
    inventory:
      - { item: iron_axe, count: 1 }
      - { item: dirt, count: 16 }

client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/collector.ts"]

# Every log in both trunks: seven each, so the run has to work up a whole trunk
# under its own canopy, then travel and do it again.
params:
  block_name: logs
  count: 14
  scaffold: true

tick:
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  # Measured at 60-62s across four runs, a two second spread. Half again on top
  # of that, rather than the 20s the four-log version ran on, which was under
  # its own measured cost and failed as often as it passed.
  timeout: 90
  goals:
    - kind: hasItem
      who: Collector
      item: oak_log
      count: 14
    - kind: completion
      who: Collector
