name: diamond-pocket
description: Mine a small diamond pocket from an exposed deepslate chamber face with the required iron pickaxe.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: deepslate, from: [-12, -60, -12], to: [18, -60, 12] }
  - fill: { block: deepslate, from: [5, -59, -5], to: [13, -53, 5] }
  - setblock: { block: diamond_ore, at: [5, -58, -1] }
  - setblock: { block: diamond_ore, at: [5, -57, 0] }
  - setblock: { block: diamond_ore, at: [5, -58, 1] }

players:
  - name: Collector
    pos: [0, -59, 0]
    inventory:
      - { item: iron_pickaxe, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/collector.ts"]

# The request this world exists to exercise.
params:
  block_name: diamond_ore
  count: 3
  scaffold: false

tick:
  - "execute as @a[name=Collector,tag=!collection_effects_applied] run effect give @s minecraft:night_vision 600 0 true"
  - "tag @a[name=Collector,tag=!collection_effects_applied] add collection_effects_applied"
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  timeout: 30
  goals:
    - kind: hasItem
      who: Collector
      item: diamond
      count: 3
    - kind: completion
      who: Collector
