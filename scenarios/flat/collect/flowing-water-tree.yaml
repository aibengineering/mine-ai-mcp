  - fill: { block: dirt, from: [3, -60, -4], to: [4, -60, -4] }
  - fill: { block: grass_block, from: [0, -60, -3], to: [2, -60, -3] }
  - fill: { block: dirt, from: [3, -60, -3], to: [4, -60, -3] }
  - fill: { block: grass_block, from: [0, -60, -2], to: [1, -60, -2] }
  - fill: { block: dirt, from: [2, -60, -2], to: [4, -60, -2] }
  - fill: { block: grass_block, from: [-1, -60, -1], to: [-1, -60, -1] }
  - fill: { block: dirt, from: [0, -60, -1], to: [4, -60, -1] }
  - fill: { block: grass_block, from: [-2, -60, 0], to: [-1, -60, 0] }
  - fill: { block: dirt, from: [0, -60, 0], to: [4, -60, 0] }
  - fill: { block: grass_block, from: [-3, -60, 1], to: [-1, -60, 1] }
  - fill: { block: dirt, from: [0, -60, 1], to: [4, -60, 1] }
  - fill: { block: grass_block, from: [-4, -60, 2], to: [-1, -60, 2] }
  - fill: { block: dirt, from: [1, -60, 2], to: [2, -60, 2] }
  - fill: { block: stone, from: [3, -60, 2], to: [4, -60, 2] }
  - fill: { block: grass_block, from: [-4, -60, 3], to: [-4, -60, 3] }
  - fill: { block: dirt, from: [-3, -60, 3], to: [0, -60, 3] }
  - fill: { block: stone, from: [1, -60, 3], to: [4, -60, 3] }
