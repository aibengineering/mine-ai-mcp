  - fill: { block: stone, from: [-2, -60, 4], to: [4, -60, 4] }
  # Restore the single six-log oak removed by the later live collection.
  - fill: { block: oak_leaves, from: [-2, -56, -1], to: [2, -54, 3] }
  - fill: { block: oak_leaves, from: [-1, -53, 0], to: [1, -53, 2] }
  - fill: { block: oak_log, from: [0, -59, 1], to: [0, -54, 1] }
  - fill: { block: water, from: [4, -54, 0], to: [4, -54, 0] }

players:
  - name: FlowCollector
    pos: [0.36, -58, 0.48]
    op: true
    inventory: [{ item: dirt, count: 24 }]

client:
  command: bun
  args: ["../../src/client-host.ts", "./flowing-water-tree.ts"]

params:
  tree_base: [0, -59, 1]
  block_name: logs
  # The screenshot requests 16. This single-tree fixture requests its six logs
  # so a timeout cannot be explained by missing resources elsewhere.
  count: 6
  scaffold: true
  allow_full_inventory: false

tick:
  - "gamemode spectator @a[name=!FlowCollector,gamemode=!spectator]"

goal:
  kind: all
  # Six barehand logs need tens of seconds. Two minutes exposes the reported
  # multi-minute stall while letting the harness stop and preserve evidence.
  timeout: 120
  goals:
    - kind: hasItem
      who: FlowCollector
      item: oak_log
      count: 6
    - kind: completion
      who: FlowCollector

