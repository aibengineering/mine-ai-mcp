name: stone-in-flowing-water
description: Collect three stone from a stream bed while starting in its current, isolating the flow without prolonged arrival or digging loops.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -8 -61 -8 8 -50 8 air"]
geometry:
  - fill: { block: glass, from: [-7, -61, -7], to: [7, -60, 7] }
  - fill: { block: stone, from: [1, -60, -1], to: [1, -60, 1] }
  - fill: { block: glass, from: [3, -59, 0], to: [3, -58, 0] }
  - setblock: { block: water, at: [3, -57, 0] }
players:
  - name: StreamMiner
    pos: [0.5, -59, 0.5]
    inventory: [{ item: iron_pickaxe, count: 1 }, { item: dirt, count: 32 }]
client:
  command: bun
  args: ["../../src/client-host.ts", "./mining-water-safety.ts"]
params: { mode: flowing }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: hasItem, who: StreamMiner, item: cobblestone, count: 3 }
    - { kind: health, who: StreamMiner, health: 20 }
    - { kind: completion, who: StreamMiner }
