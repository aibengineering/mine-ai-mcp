name: stone-from-water
description: Mine a wet stone face from a floating stance instead of repeatedly arriving without performing the dig.
minecraft:
  version: "1.21.4"
world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    naturalRegeneration: false
    randomTickSpeed: 0
reset:
  - "fill -8 -60 -8 8 -45 8 air"
geometry:
  - fill: { block: glass, from: [-5, -61, -5], to: [5, -61, 5] }
  - fill: { block: water, from: [-4, -60, -4], to: [4, -59, 4] }
  - setblock: { block: stone, at: [1, -59, 0] }
players:
  - name: WetMiner
    pos: [0.5, -59, 0.5]
    inventory:
      - { item: iron_pickaxe, count: 1 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./stone-from-water.ts"]
goal:
  kind: all
  timeout: 45
  goals:
    - { kind: hasItem, who: WetMiner, item: cobblestone, count: 1 }
    - { kind: health, who: WetMiner, health: 20 }
    - { kind: completion, who: WetMiner }
