name: dry-mining-aquifer-roof
description: Gather ordinary stone from a dry alternative instead of removing the roof over a deep water pocket.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -8 -63 -8 8 -50 8 air"]
geometry:
  - fill: { block: glass, from: [-7, -63, -7], to: [7, -60, 7] }
  - fill: { block: water, from: [1, -62, 0], to: [1, -61, 0] }
  - setblock: { block: stone, at: [1, -60, 0] }
  - setblock: { block: stone, at: [-4, -59, 0] }
players:
  - name: RoofMiner
    pos: [1.5, -59, 0.5]
    inventory: [{ item: iron_pickaxe, count: 1 }]
client:
  command: bun
  args: ["../../src/client-host.ts", "./mining-water-safety.ts"]
params: { mode: roof }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: hasItem, who: RoofMiner, item: cobblestone, count: 1 }
    - { kind: health, who: RoofMiner, health: 20 }
    - { kind: completion, who: RoofMiner }
