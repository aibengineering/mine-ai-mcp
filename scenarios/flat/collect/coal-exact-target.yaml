name: coal-exact-target
description: Collect one explicitly addressed coal ore without reading coordinates from Mineflayer's positionless palette blocks.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: andesite, from: [-12, -60, -12], to: [18, -60, 12] }
  - setblock: { block: coal_ore, at: [6, -59, 0] }
  - setblock: { block: coal_ore, at: [8, -59, 0] }

players:
  - name: Collector
    pos: [0, -59, 0]
    inventory:
      - { item: stone_pickaxe, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/collector.ts"]

params:
  block_name: coal_ore
  count: 3
  x: 6
  y: -59
  z: 0
  scaffold: false

tick:
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  timeout: 30
  goals:
    - kind: hasItem
      who: Collector
      item: coal
      count: 1
    - kind: blockAt
      who: Collector
      pos: [6, -59, 0]
      block: air
    - kind: blockAt
      who: Collector
      pos: [8, -59, 0]
      block: coal_ore
    - kind: completion
      who: Collector
