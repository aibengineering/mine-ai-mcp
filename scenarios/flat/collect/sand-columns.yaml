name: sand-columns
description: Collect three-block gravity columns from their safe exposed tops downward.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: sandstone, from: [-12, -60, -12], to: [16, -60, 12] }
  - fill: { block: sand, from: [5, -59, -2], to: [5, -57, -2] }
  - fill: { block: sand, from: [8, -59, 2], to: [8, -57, 2] }
  - fill: { block: sand, from: [11, -59, -1], to: [11, -57, -1] }

players:
  - name: Collector
    pos: [0, -59, 0]

client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/collector.ts"]

# The request this world exists to exercise.
params:
  block_name: sand
  count: 6
  scaffold: false

tick:
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  timeout: 30
  goals:
    - kind: hasItem
      who: Collector
      item: sand
      count: 6
    - kind: completion
      who: Collector
