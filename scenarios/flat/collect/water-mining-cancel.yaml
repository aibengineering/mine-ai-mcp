name: water-mining-cancel
description: Water arrives during a long obsidian dig; cancellation stops the pickaxe and preserves the idle stance against the current.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -6 -61 -5 10 -54 5 air"]
geometry:
  - fill: { block: stone, from: [-5, -61, -4], to: [9, -60, 4] }
  - fill: { block: stone, from: [-1, -59, -1], to: [7, -58, -1] }
  - fill: { block: stone, from: [-1, -59, 1], to: [7, -58, 1] }
  - setblock: { block: obsidian, at: [2, -59, 1] }
players:
  - name: CurrentMiner
    pos: [2.5, -59, 0.5]
    op: true
    inventory: [{ item: diamond_pickaxe, count: 1 }]
client:
  command: bun
  args: ["../../src/client-host.ts", "./water-mining-regression.ts"]
params: { mode: cancel }
goal:
  kind: all
  timeout: 30
  goals:
    - { kind: completion, who: CurrentMiner }
    - { kind: health, who: CurrentMiner, health: 20 }
