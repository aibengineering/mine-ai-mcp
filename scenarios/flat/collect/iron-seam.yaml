name: iron-seam
description: Mine raw iron from a five-block vein exposed across a rough stone cut.

minecraft:
  version: "1.21.4"

world:
  type: flat
  time: noon
  gamerules:
    doDaylightCycle: false
    doMobSpawning: false
    keepInventory: true
    randomTickSpeed: 0

reset:
  - "fill -16 -59 -16 20 -40 16 air"

geometry:
  - fill: { block: tuff, from: [-12, -60, -12], to: [18, -60, 12] }
  - fill: { block: stone, from: [5, -59, -5], to: [13, -54, 5] }
  - setblock: { block: iron_ore, at: [5, -58, -2] }
  - setblock: { block: iron_ore, at: [5, -57, -1] }
  - setblock: { block: iron_ore, at: [5, -58, 0] }
  - setblock: { block: iron_ore, at: [5, -57, 1] }
  - setblock: { block: iron_ore, at: [5, -58, 2] }

players:
  - name: Collector
    pos: [0, -59, 0]
    inventory:
      - { item: stone_pickaxe, count: 1 }

client:
  command: bun
  args: ["../../src/client-host.ts", "../../src/collector.ts"]

# The request this world exists to exercise.
params:
  block_name: iron_ore
  count: 5
  scaffold: false

tick:
  - "gamemode spectator @a[name=!Collector,gamemode=!spectator]"

goal:
  kind: all
  timeout: 45
  goals:
    - kind: hasItem
      who: Collector
      item: raw_iron
      count: 5
    - kind: completion
      who: Collector
