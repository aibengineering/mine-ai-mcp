name: dry-mining-water-wall
description: Collect stone beside a water source by sealing the source, keeping the dry working area unflooded.
minecraft: { version: "1.21.4" }
world:
  type: flat
  time: noon
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
reset: ["fill -8 -61 -8 8 -50 8 air"]
geometry:
  - fill: { block: glass, from: [-7, -61, -7], to: [7, -60, 7] }
  - setblock: { block: stone, at: [1, -59, 0] }
  - setblock: { block: glass, at: [2, -59, -1] }
  - setblock: { block: glass, at: [2, -59, 1] }
  - setblock: { block: glass, at: [3, -59, 0] }
  - setblock: { block: water, at: [2, -59, 0] }
players:
  - name: DryMiner
    pos: [0.5, -59, 0.5]
    inventory: [{ item: iron_pickaxe, count: 1 }, { item: dirt, count: 24 }]
client:
  command: bun
  args: ["../../src/client-host.ts", "./mining-water-safety.ts"]
params: { mode: wall }
goal:
  kind: all
  timeout: 60
  goals:
    - { kind: hasItem, who: DryMiner, item: cobblestone, count: 1 }
    - { kind: health, who: DryMiner, health: 20 }
    - { kind: completion, who: DryMiner }
