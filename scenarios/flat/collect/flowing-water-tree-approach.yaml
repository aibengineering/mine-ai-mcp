name: flowing-water-tree-approach
description: Collect an oak beside a waterfall from the north bank, preparing the wet trunk with carried dirt.
template: flowing-water-tree.yaml

# Keep the falling column against the cliff until it reaches the bank. This
# produces the level-four flow seen in the live incident, rather than spilling
# sideways one block above the bank and producing level three at the tree.
setup:
  - "fill 3 -57 -1 3 -54 1 stone"
  - "fill 4 -57 -1 4 -54 -1 stone"
  - "fill 4 -57 1 4 -54 1 stone"

players:
  - name: FlowCollector
    pos: [0.36, -59, -2.5]
    op: true
    inventory: [{ item: dirt, count: 24 }]
