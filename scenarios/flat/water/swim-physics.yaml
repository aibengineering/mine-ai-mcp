name: swim-physics
description: Measure pinned liquid physics, depth holding, and wall contact; this is a control probe, not a navigation verdict.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false }
geometry:
  - fill: { block: stone, from: [-5, -61, -5], to: [5, -42, 5] }
  - fill: { block: water, from: [-4, -60, -4], to: [4, -43, 4] }
players:
  - name: Diver
    pos: [0.5, -49, 0.5]
client:
  command: bun
  args: ["../../src/client-host.ts", "./swim-physics.ts"]
goal:
  kind: all
  timeout: 45
  goals:
    - { kind: completion, who: Diver }
    - { kind: health, who: Diver, health: 20 }
