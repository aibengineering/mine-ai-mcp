name: ocean-to-air-pocket
description: Expected safe no-path refusal for a sea-to-air-pocket route requiring a submerged dirt breach; successful crossing is deferred.
minecraft: { version: "1.21.4" }
world:
  type: flat
  gamerules: { doMobSpawning: false, naturalRegeneration: false, doDaylightCycle: false, randomTickSpeed: 0 }
geometry:
  # Bedrock prevents a dry detour or a different entry through the pocket roof.
  - fill: { block: bedrock, from: [-2, -63, -2], to: [6, -55, 2] }
  - fill: { block: air, from: [-1, -55, -1], to: [5, -55, 1] }
  - fill: { block: water, from: [-1, -56, -1], to: [5, -56, 1] }
  - fill: { block: water, from: [0, -60, 0], to: [0, -56, 0] }
  # The only way into the pocket is through this two-block dirt plug.
  - fill: { block: dirt, from: [1, -60, 0], to: [1, -59, 0] }
  # The passage rises behind the plug; the destination has supported footing.
  - fill: { block: air, from: [2, -60, 0], to: [2, -58, 0] }
  - fill: { block: air, from: [3, -59, 0], to: [4, -58, 0] }
players:
  - name: PocketDiver
    pos: [0.5, -56, 0.5]
    inventory:
      - { item: diamond_shovel, count: 1 }
      - { item: diamond_pickaxe, count: 1 }
      - { item: cobblestone, count: 64 }
client:
  command: bun
  args: ["../../src/client-host.ts", "./ocean-air-transition.ts"]
params:
  # Keep the unreachable destination: completion means a verified safe refusal, not arrival.
  destination: [3, -59, 0]
  barriers: [[1, -60, 0], [1, -59, 0]]
goal:
  kind: all
  timeout: 90
  goals:
    - { kind: completion, who: PocketDiver }
    - { kind: health, who: PocketDiver, health: 20 }
    - { kind: blockAt, who: PocketDiver, pos: [1, -60, 0], block: dirt }
    - { kind: blockAt, who: PocketDiver, pos: [1, -59, 0], block: dirt }
